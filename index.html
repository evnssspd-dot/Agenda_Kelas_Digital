<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Agenda & Absensi Kelas - Enterprise</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (XLSX) untuk Export & Import Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- HTML5-Qrcode untuk Kamera Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script>
        const STEIN_URL = "https://api.steinhq.com/v1/storages/6a70b66092b1163e9728b63a";
    </script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center bg-gradient-to-tr from-blue-900 via-indigo-900 to-slate-900 p-4">
        <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl max-w-md w-full p-8 border border-white/20">
            <div class="text-center mb-8">
                <div id="loginLogoContainer" class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full text-2xl mb-4 shadow-inner overflow-hidden">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 id="loginSchoolTitle" class="text-2xl font-bold text-slate-900 tracking-tight">Sistem Agenda & Absensi</h1>
                <p class="text-sm text-slate-500 mt-1">Silakan masuk menggunakan akun Anda</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Username / Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="loginUser" required placeholder="Masukkan username..." class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="loginPass" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition transform active:scale-95">Masuk Aplikasi</button>
            </form>
            <div class="mt-6 text-center text-xs text-slate-400">Terhubung ke Database Stein HQ</div>
        </div>
    </div>

    <!-- HALAMAN UTAMA APLIKASI -->
    <div id="appPage" class="hidden min-h-screen flex flex-col">
        <!-- Top Navbar -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="text-slate-600 hover:text-blue-600 md:hidden p-2"><i class="fa-solid fa-bars text-xl"></i></button>
                    <div class="flex items-center space-x-3">
                        <div id="headerLogoBox" class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold shadow-sm overflow-hidden">
                            <i class="fa-solid fa-school-flag"></i>
                        </div>
                        <div>
                            <span id="schoolNameHeader" class="font-bold text-base text-slate-800 block leading-tight">Nama Sekolah</span>
                            <span id="schoolNpsnHeader" class="text-xs text-slate-400 font-medium">NPSN: -</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-right hidden sm:block">
                        <div id="userNameDisplay" class="text-sm font-bold text-slate-700">User</div>
                        <div id="userRoleBadge" class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full inline-block">Role</div>
                    </div>
                    <button onclick="logout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3.5 py-2 rounded-xl text-sm font-semibold transition flex items-center"><i class="fa-solid fa-power-off mr-1.5"></i>Logout</button>
                </div>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- Sidebar (Menu Lengkap & Dinamis) -->
            <aside id="sidebar" class="bg-white w-72 border-r border-slate-200 hidden md:block overflow-y-auto transition-all p-4 space-y-1 z-20">
                <div id="sidebarMenu" class="space-y-1"></div>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-1 p-6 overflow-y-auto bg-slate-100" id="mainContent"></main>
        </div>
    </div>

    <!-- GLOBAL MODAL -->
    <div id="modalContainer" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-100">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Modal Title</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        let currentUser = null;
        let html5QrCode = null;

        async function fetchStein(table, method = 'get', data = null, condition = null) {
            let url = `${STEIN_URL}/${table}`;
            try {
                if (method === 'get') {
                    let res = await fetch(url);
                    return await res.json();
                } else if (method === 'post') {
                    let res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
                    return await res.json();
                } else if (method === 'put') {
                    let res = await fetch(url, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({condition: condition, set: data}) });
                    return await res.json();
                } else if (method === 'delete') {
                    let res = await fetch(url, { method: 'DELETE', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(condition) });
                    return await res.json();
                }
            } catch (err) {
                console.error("Stein API Error:", err);
                return [];
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();

            let users = await fetchStein('users');
            let found = users.find(x => x.username === u && x.password === p);

            if (found) {
                currentUser = found;
                localStorage.setItem('user', JSON.stringify(found));
                initApp();
            } else {
                alert("Username atau Password salah!");
            }
        }

        function logout() {
            localStorage.removeItem('user');
            location.reload();
        }

        window.onload = async () => {
            await loadGlobalProfil();
            const saved = localStorage.getItem('user');
            if (saved) {
                currentUser = JSON.parse(saved);
                initApp();
            }
        }

        async function loadGlobalProfil() {
            let profil = await fetchStein('profil');
            if(profil && profil.length > 0) {
                let p = profil[0];
                document.getElementById('schoolNameHeader').innerText = p.nama_sekolah || "SMA Negeri / Swasta";
                document.getElementById('schoolNpsnHeader').innerText = "NPSN: " + (p.npsn || "-");
                document.getElementById('loginSchoolTitle').innerText = p.nama_sekolah || "Sistem Agenda & Absensi";
                if(p.logo) {
                    document.getElementById('headerLogoBox').innerHTML = `<img src="${p.logo}" class="w-full h-full object-cover">`;
                    document.getElementById('loginLogoContainer').innerHTML = `<img src="${p.logo}" class="w-full h-full object-cover">`;
                }
            }
        }

        function initApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('appPage').classList.remove('hidden');
            document.getElementById('userRoleBadge').innerText = currentUser.role.toUpperCase();
            document.getElementById('userNameDisplay').innerText = currentUser.nama || currentUser.username;
            
            renderSidebar();
            if(currentUser.role === 'admin') loadAdminDashboard();
            else loadGuruDashboard();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        function renderSidebar() {
            const menu = document.getElementById('sidebarMenu');
            let html = '';
            const btn = (icon, label, func) => `
                <button onclick="${func}; if(window.innerWidth < 768) toggleSidebar();" class="w-full text-left px-4 py-3 rounded-xl hover:bg-blue-50 text-slate-600 hover:text-blue-600 font-medium transition flex items-center space-x-3 group">
                    <span class="w-8 h-8 rounded-lg bg-slate-100 group-hover:bg-blue-100 text-slate-500 group-hover:text-blue-600 flex items-center justify-center transition"><i class="${icon}"></i></span>
                    <span class="text-sm">${label}</span>
                </button>
            `;

            if (currentUser.role === 'admin') {
                html += btn('fa-solid fa-chart-pie', 'Dashboard Admin', 'loadAdminDashboard');
                html += btn('fa-solid fa-user-graduate', 'Data Siswa', 'loadDataSiswa');
                html += btn('fa-solid fa-school', 'Data Kelas / Rombel', 'loadDataKelas');
                html += btn('fa-solid fa-chalkboard-user', 'Data Guru', 'loadDataGuru');
                html += btn('fa-solid fa-user-tie', 'Wali Kelas', 'loadWaliKelas');
                html += btn('fa-solid fa-calendar-days', 'Periode Tahun Ajaran', 'loadPeriode');
                html += btn('fa-solid fa-users-gear', 'Manajemen User', 'loadManajemenUser');
                html += btn('fa-solid fa-building-columns', 'Menu Sekolah & Profil', 'loadMenuSekolah');
            } else {
                html += btn('fa-solid fa-chart-line', 'Dashboard Guru', 'loadGuruDashboard');
                html += btn('fa-solid fa-book', 'Data Mapel', 'loadGuruMapel');
                html += btn('fa-solid fa-user-group', 'Data Siswa Per Rombel', 'loadGuruSiswa');
                html += btn('fa-solid fa-qrcode', 'Absensi & QR Scan', 'loadGuruAbsen');
                html += btn('fa-solid fa-user-clock', 'Belum Absen', 'loadGuruBelumAbsen');
                html += btn('fa-solid fa-file-excel', 'Rekap Absensi', 'loadGuruRekap');
            }
            menu.innerHTML = html;
        }

        // ================= ADMIN DASHBOARD & MENU =================
        async function loadAdminDashboard() {
            let s = await fetchStein('siswa');
            let g = await fetchStein('guru');
            let k = await fetchStein('kelas');
            document.getElementById('mainContent').innerHTML = `
                <div class="space-y-6">
                    <div><h1 class="text-2xl font-bold text-slate-800">Dashboard Administrator</h1><p class="text-sm text-slate-500">Kelola keseluruhan data akademik dan sistem sekolah.</p></div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-200 flex items-center space-x-4">
                            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-2xl"><i class="fa-solid fa-users"></i></div>
                            <div><div class="text-slate-500 text-sm font-medium">Total Siswa</div><div class="text-2xl font-bold text-slate-800">${s.length || 0}</div></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-200 flex items-center space-x-4">
                            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl"><i class="fa-solid fa-chalkboard-user"></i></div>
                            <div><div class="text-slate-500 text-sm font-medium">Total Guru</div><div class="text-2xl font-bold text-slate-800">${g.length || 0}</div></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-200 flex items-center space-x-4">
                            <div class="w-14 h-14 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center text-2xl"><i class="fa-solid fa-school"></i></div>
                            <div><div class="text-slate-500 text-sm font-medium">Total Kelas</div><div class="text-2xl font-bold text-slate-800">${k.length || 0}</div></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 1. DATA SISWA ---
        async function loadDataSiswa() {
            let data = await fetchStein('siswa');
            let html = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div><h1 class="text-2xl font-bold text-slate-800">Data Siswa</h1><p class="text-sm text-slate-500">Input manual, upload foto, edit, hapus & import Excel.</p></div>
                        <div class="flex items-center space-x-3">
                            <input type="file" id="excelSiswa" class="hidden" onchange="importExcelSiswa(this)">
                            <button onclick="document.getElementById('excelSiswa').click()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow-sm flex items-center"><i class="fa-solid fa-file-excel mr-2"></i>Import Excel</button>
                            <button onclick="openFormSiswa()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow-sm flex items-center"><i class="fa-solid fa-plus mr-2"></i>Tambah Siswa</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase font-semibold"><th class="p-4">Foto</th><th class="p-4">NIS</th><th class="p-4">Nama Siswa</th><th class="p-4">Rombel</th><th class="p-4 text-center">Aksi</th></tr></thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
            `;
            if(data.length === 0) html += `<tr><td colspan="5" class="p-8 text-center text-slate-400">Belum ada data siswa.</td></tr>`;
            else {
                data.forEach(s => {
                    html += `
                        <tr class="hover:bg-slate-50/50">
                            <td class="p-4"><img src="${s.foto || 'https://via.placeholder.com/150'}" class="w-10 h-10 object-cover rounded-xl border"></td>
                            <td class="p-4 font-semibold text-slate-700">${s.nis}</td>
                            <td class="p-4">${s.nama}</td>
                            <td class="p-4"><span class="px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-bold">${s.rombel}</span></td>
                            <td class="p-4 text-center space-x-2">
                                <button onclick="openFormSiswa('${s.nis}', '${s.nama}', '${s.rombel}', '${s.foto}')" class="text-amber-600 hover:text-amber-800 p-1.5"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="hapusSiswa('${s.nis}')" class="text-rose-600 hover:text-rose-800 p-1.5"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }
            html += `</tbody></table></div></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        async function openFormSiswa(nis = '', nama = '', rombel = '', foto = '') {
            let kelasList = await fetchStein('kelas');
            let options = kelasList.map(k => `<option value="${k.nama_rombel}" ${rombel === k.nama_rombel ? 'selected' : ''}>${k.nama_rombel}</option>`).join('');
            let html = `
                <form onsubmit="submitSiswa(event, '${nis}')" class="space-y-4">
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">NIS</label><input type="text" id="sNis" value="${nis}" ${nis ? 'readonly' : 'required'} class="w-full p-3 bg-slate-50 border rounded-xl outline-none"></div>
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Siswa</label><input type="text" id="sNama" value="${nama}" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none"></div>
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Rombel</label><select id="sRombel" required class="w-full p-3 bg-slate-50 border rounded-xl outline-none"><option value="">Pilih Rombel</option>${options}</select></div>
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Upload Foto</label><input type="file" onchange="toBase64(this, 'sFoto')" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-50 file:text-blue-700"><input type="hidden" id="sFoto" value="${foto}"></div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold">Simpan</button>
                </form>
            `;
            showModal(nis ? 'Edit Siswa' : 'Tambah Siswa', html);
        }

        function toBase64(element, targetId) {
            let reader = new FileReader();
            reader.onloadend = () => document.getElementById(targetId).value = reader.result;
            reader.readAsDataURL(element.files[0]);
        }

        async function submitSiswa(e, oldNis) {
            e.preventDefault();
            let nis = document.getElementById('sNis').value;
            let nama = document.getElementById('sNama').value;
            let rombel = document.getElementById('sRombel').value;
            let foto = document.getElementById('sFoto').value;
            if(oldNis) await fetchStein('siswa', 'put', {nama, rombel, foto}, {nis: oldNis});
            else await fetchStein('siswa', 'post', [{nis, nama, rombel, foto}]);
            closeModal(); loadDataSiswa();
        }

        async function hapusSiswa(nis) {
            if(confirm("Hapus siswa ini?")) { await fetchStein('siswa', 'delete', null, {nis}); loadDataSiswa(); }
        }

        async function importExcelSiswa(input) {
            let reader = new FileReader();
            reader.onload = async (e) => {
                let workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
                let json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                await fetchStein('siswa', 'post', json);
                alert("Import Excel Berhasil!"); loadDataSiswa();
            };
            reader.readAsArrayBuffer(input.files[0]);
        }

        // --- 2. DATA KELAS ---
        async function loadDataKelas() {
            let data = await fetchStein('kelas');
            let html = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div><h1 class="text-2xl font-bold text-slate-800">Data Kelas / Rombel</h1><p class="text-sm text-slate-500">Tambah kelas, edit, dan hapus.</p></div>
                        <button onclick="openFormKelas()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-sm">Tambah Kelas</button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                        <table class="w-full text-left">
                            <thead><tr class="bg-slate-50 border-b text-xs uppercase text-slate-600"><th class="p-4">Nama Rombel</th><th class="p-4">Tingkat</th><th class="p-4 text-center">Aksi</th></tr></thead>
                            <tbody class="divide-y text-sm">
            `;
            if(data.length === 0) html += `<tr><td colspan="3" class="p-8 text-center text-slate-400">Belum ada data kelas.</td></tr>`;
            else {
                data.forEach(k => {
                    html += `<tr><td class="p-4 font-semibold">${k.nama_rombel}</td><td class="p-4">${k.tingkat || '-'}</td><td class="p-4 text-center space-x-2"><button onclick="openFormKelas('${k.nama_rombel}', '${k.tingkat}')" class="text-amber-600"><i class="fa-solid fa-pen-to-square"></i></button><button onclick="hapusKelas('${k.nama_rombel}')" class="text-rose-600"><i class="fa-solid fa-trash"></i></button></td></tr>`;
                });
            }
            html += `</tbody></table></div></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        function openFormKelas(nama = '', tingkat = '') {
            let html = `
                <form onsubmit="submitKelas(event, '${nama}')" class="space-y-4">
                    <div><label class="block text-xs font-semibold uppercase mb-1">Nama Rombel</label><input type="text" id="kNama" value="${nama}" required class="w-full p-3 border rounded-xl"></div>
                    <div><label class="block text-xs font-semibold uppercase mb-1">Tingkat</label><input type="text" id="kTingkat" value="${tingkat}" placeholder="X / XI / XII" class="w-full p-3 border rounded-xl"></div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold">Simpan</button>
                </form>
            `;
            showModal(nama ? 'Edit Kelas' : 'Tambah Kelas', html);
        }

        async function submitKelas(e, oldName) {
            e.preventDefault();
            let nama_rombel = document.getElementById('kNama').value;
            let tingkat = document.getElementById('kTingkat').value;
            if(oldName) await fetchStein('kelas', 'put', {nama_rombel, tingkat}, {nama_rombel: oldName});
            else await fetchStein('kelas', 'post', [{nama_rombel, tingkat}]);
            closeModal(); loadDataKelas();
        }

        async function hapusKelas(nama) {
            if(confirm("Hapus kelas?")) { await fetchStein('kelas', 'delete', null, {nama_rombel: nama}); loadDataKelas(); }
        }

        // --- 3. DATA GURU ---
        async function loadDataGuru() {
            let data = await fetchStein('guru');
            let html = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div><h1 class="text-2xl font-bold text-slate-800">Data Guru</h1><p class="text-sm text-slate-500">Input manual, upload foto, edit, hapus & import Excel.</p></div>
                        <div class="flex space-x-3">
                            <input type="file" id="excelGuru" class="hidden" onchange="importExcelGuru(this)">
                            <button onclick="document.getElementById('excelGuru').click()" class="bg-emerald-600 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-sm">Import Excel</button>
                            <button onclick="openFormGuru()" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-sm">Tambah Guru</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                        <table class="w-full text-left">
                            <thead><tr class="bg-slate-50 border-b text-xs uppercase text-slate-600"><th class="p-4">Foto</th><th class="p-4">NIP / ID</th><th class="p-4">Nama Guru</th><th class="p-4">Mapel</th><th class="p-4 text-center">Aksi</th></tr></thead>
                            <tbody class="divide-y text-sm">
            `;

        function startScanner() {
            if (html5QrCode) stopScanner();
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 250 },
                async (nis) => {
                    let siswa = await fetchStein('siswa');
                    let s = siswa.find(x => x.nis === nis);
                    if(!s) { alert("NIS tidak ditemukan!"); return; }
                    let today = new Date().toISOString().split('T')[0];
                    await fetchStein('absensi', 'post', [{nis: s.nis, nama: s.nama, rombel: s.rombel, tanggal: today, jam_pelajaran: "1", mapel: "Umum", status: "Hadir"}]);
                    alert(`Berhasil Absen Hadir: ${s.nama}`);
                },
                (err) => {}
            ).catch(e => {});
        }

        function stopScanner() {
            if(html5QrCode) html5QrCode.stop().then(() => html5QrCode.clear()).catch(e => {});
        }

                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                        <table class="w-full text-left" id="tabelRekap">
                            <thead><tr class="bg-slate-50 border-b text-xs uppercase text-slate-600"><th class="p-4">Tanggal</th><th class="p-4">NIS</th><th class="p-4">Nama</th><th class="p-4">Rombel</th><th class="p-4">Status</th></tr></thead>
                            <tbody class="divide-y text-sm" id="rekapTbody">
            `;
            if(!data || data.length === 0) html += `<tr><td colspan="5" class="p-8 text-center text-slate-400">Belum ada data.</td></tr>`;
            else {
                data.forEach(a => {
                    html += `<tr><td class="p-4">${a.tanggal}</td><td class="p-4">${a.nis}</td><td class="p-4">${a.nama}</td><td class="p-4">${a.rombel}</td><td class="p-4"><span class="px-2 py-1 rounded text-xs font-bold bg-blue-100 text-blue-700">${a.status}</span></td></tr>`;
                });
            }
            html += `</tbody></table></div></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        function filterRekap() {
            let tgl = document.getElementById('fTgl').value;
            let nama = document.getElementById('fNama').value.toLowerCase();
            let rombel = document.getElementById('fRombel').value.toLowerCase();

            let filtered = window.rekapDataGlobal.filter(item => {
                let m1 = tgl ? item.tanggal === tgl : true;
                let m2 = nama ? (item.nama && item.nama.toLowerCase().includes(nama)) || (item.nis && item.nis.includes(nama)) : true;
                let m3 = rombel ? item.rombel && item.rombel.toLowerCase().includes(rombel) : true;
                return m1 && m2 && m3;
            });

            let tbody = document.getElementById('rekapTbody');
            let html = '';
            if(filtered.length === 0) html = `<tr><td colspan="5" class="p-8 text-center text-slate-400">Tidak ditemukan.</td></tr>`;
            else {
                filtered.forEach(a => {
                    html += `<tr><td class="p-4">${a.tanggal}</td><td class="p-4">${a.nis}</td><td class="p-4">${a.nama}</td><td class="p-4">${a.rombel}</td><td class="p-4"><span class="px-2 py-1 rounded text-xs font-bold bg-blue-100 text-blue-700">${a.status}</span></td></tr>`;
                });
            }
            tbody.innerHTML = html;
        }

        function exportExcelRekap() {
            XLSX.writeFile(XLSX.utils.table_to_book(document.getElementById("tabelRekap"), {sheet: "Rekap"}), "Rekap_Absensi.xlsx");
        }

        // --- MODAL UTILS ---
        function showModal(title, body) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = body;
            document.getElementById('modalContainer').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('modalContainer').classList.add('hidden');
        }
    </script>
</body>
</html>
