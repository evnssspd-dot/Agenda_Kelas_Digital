<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Agenda & Presensi Kelas Terpadu</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS untuk Ekspor & Impor Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- ZXing untuk QR Scanner Kamera -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-950 p-4">
        <div class="bg-white/10 backdrop-blur-2xl border border-white/10 p-8 rounded-3xl shadow-2xl w-full max-w-md text-white">
            <div class="text-center mb-8">
                <div class="inline-block bg-indigo-600 p-4 rounded-2xl shadow-xl mb-3 text-white">
                    <i class="fa-solid fa-graduation-cap text-3xl"></i>
                </div>
                <h1 class="text-xl font-black tracking-wider">AGENDA & PRESENSI KELAS</h1>
                <p class="text-xs text-indigo-200 mt-1">Terhubung ke Database Stein HQ</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-indigo-200 mb-2">Username</label>
                    <input type="text" id="login-user" required placeholder="Masukkan username..." class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-indigo-200 mb-2">Password</label>
                    <input type="password" id="login-pass" required placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl shadow-lg transition duration-200 cursor-pointer text-sm">
                    Masuk ke Sistem
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen" class="min-h-screen flex flex-col hidden">
        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 sticky top-0 z-50 shadow-xs">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-sm">
                    <i class="fa-solid fa-school text-base"></i>
                </div>
                <div>
                    <h1 id="app-title-header" class="font-bold text-slate-800 text-sm">Agenda & Presensi Kelas</h1>
                    <span class="text-xs text-slate-400">Sistem Akademik Terpadu</span>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right hidden sm:block">
                    <span id="user-display-name" class="block text-sm font-bold text-slate-800">-</span>
                    <span id="user-display-role" class="inline-block bg-indigo-50 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-extrabold uppercase">-</span>
                </div>
                <button onclick="logoutApp()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold px-4 py-2 rounded-xl transition cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Keluar
                </button>
            </div>
        </header>

        <div class="flex flex-1">
            <aside id="sidebar-container" class="w-72 bg-white border-r border-slate-200 p-4 space-y-1.5 hidden md:block shrink-0"></aside>
            <main class="flex-1 p-6 md:p-8 overflow-y-auto" id="main-content-container"></main>
        </div>
    </div>

    <!-- MODAL CONTAINER -->
    <div id="app-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center z-50 hidden p-4">
        <div id="modal-content" class="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-6 overflow-y-auto max-h-[90vh]"></div>
    </div>

    <!-- MAIN SCRIPT -->
    <script>
        const STEIN = "https://api.steinhq.com/v1/storages/6a70b66092b1163e9728b63a";
        let currentUser = null;
        let activeQRReader = null;

        // --- AUTHENTICATION ---
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();

            try {
                let res = await fetch(`${STEIN}/users`);
                let users = await res.json();
                let found = users.find(x => x.username === u && x.password === p);

                if (found || (u === "admin" && p === "admin")) {
                    currentUser = found || { username: "admin", role: "admin", nama: "Administrator" };
                    initAppSession();
                } else {
                    alert("Username atau Password salah!");
                }
            } catch(err) {
                if(u === "admin" && p === "admin") {
                    currentUser = { username: "admin", role: "admin", nama: "Administrator" };
                    initAppSession();
                } else {
                    alert("Gagal terhubung ke server Stein HQ. Periksa koneksi internet.");
                }
            }
        }

        function initAppSession() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = currentUser.nama;
            document.getElementById('user-display-role').innerText = currentUser.role;
            buildSidebarMenu();
            loadDashboard();
        }

        function logoutApp() {
            if(activeQRReader) { try { activeQRReader.reset(); } catch(e){} }
            currentUser = null;
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        // --- SIDEBAR BUILDER ---
        function buildSidebarMenu() {
            let sb = document.getElementById('sidebar-container');
            let role = (currentUser.role || '').toLowerCase();
            let html = '';

            if (role === 'admin') {
                html = `
                    <a href="#" onclick="loadDashboard(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition active"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span></a>
                    <a href="#" onclick="loadDataSiswa(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-users w-5"></i><span>Data Siswa</span></a>
                    <a href="#" onclick="loadDataKelas(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-door-open w-5"></i><span>Data Kelas</span></a>
                    <a href="#" onclick="loadDataGuru(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-chalkboard-user w-5"></i><span>Data Guru</span></a>
                    <a href="#" onclick="loadWaliKelas(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-user-tie w-5"></i><span>Wali Kelas</span></a>
                    <a href="#" onclick="loadPeriode(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-calendar-days w-5"></i><span>Periode Tahun Ajaran</span></a>
                    <a href="#" onclick="loadManajemenUser(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-shield-halved w-5"></i><span>Manajemen User</span></a>
                    <a href="#" onclick="loadProfilSekolah(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-school w-5"></i><span>Profil Sekolah</span></a>
                `;
            } else {
                html = `
                    <a href="#" onclick="loadDashboard(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition active"><i class="fa-solid fa-house w-5"></i><span>Dashboard Guru</span></a>
                    <a href="#" onclick="loadMapelGuru(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-book w-5"></i><span>Data Mapel Saya</span></a>
                    <a href="#" onclick="loadDataSiswa(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-user-group w-5"></i><span>Data Siswa Per Rombel</span></a>
                    <a href="#" onclick="loadAbsensiQR(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-qrcode w-5"></i><span>Absensi & QR Scan</span></a>
                    <a href="#" onclick="loadBelumAbsen(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-user-clock w-5"></i><span>Belum Absen</span></a>
                    <a href="#" onclick="loadRekapAbsensi(this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-file-excel w-5"></i><span>Rekap Absensi</span></a>
                `;
            }
            sb.innerHTML = html;
        }

        function setMenuActive(el) {
            if(activeQRReader) { try { activeQRReader.reset(); } catch(e){} }
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('bg-indigo-50', 'text-indigo-600', 'active'));
            if(el) el.classList.add('bg-indigo-50', 'text-indigo-600', 'active');
        }

        function closeModal() { document.getElementById('app-modal').classList.add('hidden'); }
        function openModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('app-modal').classList.remove('hidden');
        }

        // --- DASHBOARD ---
        async function loadDashboard(el) {
            setMenuActive(el);
            let area = document.getElementById('main-content-container');
            area.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-indigo-900 to-violet-900 text-white p-8 rounded-3xl shadow-xl">
                        <h2 class="text-2xl font-black mb-2">Selamat Datang, ${currentUser.nama}</h2>
                        <p class="text-indigo-200 text-sm max-w-2xl leading-relaxed">
                            Kelola agenda kelas, pindai kehadiran QR siswa, pantau status belum absen, dan bagikan rekap laporan langsung ke WhatsApp secara otomatis.
                        </p>
                    </div>
                </div>
            `;
        }

        // --- 1. DATA SISWA (Sheet: siswa -> nis, nama, rombel, foto) ---
        async function loadDataSiswa(el) {
            setMenuActive(el);
            let area = document.getElementById('main-content-container');
            area.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-indigo-600 text-2xl"></i><p class="text-xs text-slate-400 mt-2">Memuat data...</p></div>`;
            try {
                let res = await fetch(`${STEIN}/siswa`);
                let data = await res.json();
                let html = `
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 p-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                            <div>
                                <h3 class="text-lg font-black text-slate-800">Data Siswa</h3>
                                <p class="text-xs text-slate-400">Kelola informasi siswa, upload foto, dan import Excel.</p>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <label class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer transition">
                                    <i class="fa-solid fa-file-excel mr-1"></i> Import Excel
                                    <input type="file" accept=".xlsx, .xls" class="hidden" onchange="importExcelSiswa(event)">
                                </label>
                                ${currentUser.role.toLowerCase() === 'admin' ? `<button onclick="openFormSiswa()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl"><i class="fa-solid fa-plus mr-1"></i> Tambah Siswa</button>` : ''}
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-400 text-xs uppercase border-b border-slate-100">
                                        <th class="p-3">Foto</th>
                                        <th class="p-3">NIS</th>
                                        <th class="p-3">Nama</th>
                                        <th class="p-3">Rombel</th>
                                        ${currentUser.role.toLowerCase() === 'admin' ? '<th class="p-3">Aksi</th>' : ''}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                `;
                if (!data || data.length === 0) {
                    html += `<tr><td colspan="5" class="p-4 text-center text-slate-400">Belum ada data siswa.</td></tr>`;
                } else {
                    data.forEach((s, idx) => {
                        html += `
                            <tr>
                                <td class="p-3"><img src="${s.foto || 'https://via.placeholder.com/40'}" class="w-9 h-9 rounded-full object-cover border"></td>
                                <td class="p-3 font-semibold">${s.nis || '-'}</td>
                                <td class="p-3 font-bold">${s.nama || '-'}</td>
                                <td class="p-3"><span class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md text-xs font-bold">${s.rombel || '-'}</span></td>
                                ${currentUser.role.toLowerCase() === 'admin' ? `
                                    <td class="p-3 flex gap-2">
                                        <button onclick='openFormSiswa(${JSON.stringify(s)})' class="text-blue-600 hover:bg-blue-50 p-2 rounded-lg transition"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="hapusSiswa('${s.nis}')" class="text-rose-600 hover:bg-rose-50 p-2 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
                                    </li>
                                ` : ''}
                            </tr>
                        `;
                    });
                }
                html += `</tbody></table></div></div>`;
                area.innerHTML = html;
            } catch(e) {
                area.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-xl text-sm">Gagal memuat sheet siswa.</div>`;
            }
        }

        async function openFormSiswa(data = null) {
            let kelasRes = await fetch(`${STEIN}/kelas`).catch(()=>[]);
            let kelasList = await kelasRes.json().catch(()=>[]);
            let options = kelasList.map(k => `<option value="${k.nama_rombel}" ${data && data.rombel === k.nama_rombel ? 'selected' : ''}>${k.nama_rombel}</option>`).join('');

            let html = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-black text-slate-800">${data ? 'Edit Siswa' : 'Tambah Siswa Baru'}</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form onsubmit="saveSiswa(event, '${data ? data.nis : ''}')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">NIS</label>
                        <input type="text" id="inp-nis" required value="${data ? data.nis : ''}" ${data ? 'readonly' : ''} class="w-full border rounded-xl px-3 py-2 text-sm bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Nama Lengkap</label>
                        <input type="text" id="inp-nama" required value="${data ? data.nama : ''}" class="w-full border rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Rombel</label>
                        <select id="inp-rombel" required class="w-full border rounded-xl px-3 py-2 text-sm bg-white">
                            <option value="">Pilih Rombel...</option>
                            ${options}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Foto (URL / Base64)</label>
                        <input type="text" id="inp-foto" value="${data ? data.foto || '' : ''}" placeholder="https://..." class="w-full border rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl text-xs font-bold text-slate-600">Batal</button>
                        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700">Simpan</button>
                    </div>
                </form>
            `;
            openModal(html);
        }

        async function saveSiswa(e, oldNis) {
            e.preventDefault();
            let payload = {
                nis: document.getElementById('inp-nis').value.trim(),
                nama: document.getElementById('inp-nama').value.trim(),
                rombel: document.getElementById('inp-rombel').value,
                foto: document.getElementById('inp-foto').value.trim()
            };

            try {
                if(oldNis) {
                    await fetch(`${STEIN}/siswa`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({condition: {nis: oldNis}, set: payload})
                    });
                } else {
                    await fetch(`${STEIN}/siswa`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify([payload])
                    });
                }
                closeModal();
                loadDataSiswa(document.querySelector('.menu-btn'));
            } catch(err) { alert("Gagal menyimpan data siswa."); }
        }

        async function hapusSiswa(nis) {
            if(!confirm("Yakin ingin menghapus siswa ini?")) return;
            try {
                await fetch(`${STEIN}/siswa?nis=${nis}`, { method: 'DELETE' });
                loadDataSiswa(document.querySelector('.menu-btn'));
            } catch(e) { alert("Gagal menghapus."); }
        }

        async function importExcelSiswa(e) {
            let file = e.target.files[0];
            let reader = new FileReader();
            reader.onload = async function(evt) {
                let data = new Uint8Array(evt.target.result);
                let wb = XLSX.read(data, {type: 'array'});
                let json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                if(json.length > 0) {
                    try {
                        await fetch(`${STEIN}/siswa`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(json)
                        });
                        alert(`Berhasil mengimpor ${json.length} data siswa.`);
                        loadDataSiswa(document.querySelector('.menu-btn'));
                    } catch(err) { alert("Gagal mengunggah data Excel ke server."); }
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // --- 2. DATA KELAS (Sheet: kelas -> nama_rombel, tingkat) ---
        async function loadDataKelas(el) {
            setMenuActive(el);
            let area = document.getElementById('main-content-container');
            area.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-indigo-600 text-2xl"></i></div>`;
            try {
                let res = await fetch(`${STEIN}/kelas`);
                let data = await res.json();
                let html = `
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-lg font-black text-slate-800">Data Kelas & Rombel</h3>
                            <button onclick="openFormKelas()" class="bg-indigo-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl"><i class="fa-solid fa-plus mr-1"></i> Tambah Kelas</button>
                        </div>
                        <table class="w-full text-left text-sm divide-y divide-slate-100">
                            <thead><tr class="bg-slate-50 text-slate-400 text-xs uppercase"><th class="p-3">Nama Rombel</th><th class="p-3">Tingkat</th><th class="p-3">Aksi</th></tr></thead>
                            <tbody>
                `;
                if(!data || data.length === 0) {
                    html += `<tr><td colspan="3" class="p-4 text-center text-slate-400">Belum ada data kelas.</td></tr>`;
                } else {
                    data.forEach(k => {
                        html += `<tr>
                            <td class="p-3 font-bold">${k.nama_rombel}</td>
                            <td class="p-3">${k.tingkat}</td>
                            <td class="p-3 flex gap-2">
                                <button onclick='openFormKelas(${JSON.stringify(k)})' class="text-blue-600 p-2"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="hapusKelas('${k.nama_rombel}')" class="text-rose-600 p-2"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>`;
                    });
                }
                html += `</tbody></table></div>`;
                area.innerHTML = html;
            } catch(e) { area.innerHTML = `<div class="p-4 text-rose-600">Gagal memuat data kelas.</div>`; }
        }

        function openFormKelas(data = null) {
            let html = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-black">${data ? 'Edit Kelas' : 'Tambah Kelas Baru'}</h3>
                    <button onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form onsubmit="saveKelas(event, '${data ? data.nama_rombel : ''}')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Nama Rombel</label>
                        <input type="text" id="inp-rombel-nama" required value="${data ? data.nama_rombel : ''}" class="w-full border rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Tingkat</label>
                        <input type="text" id="inp-tingkat" required value="${data ? data.tingkat : ''}" placeholder="Contoh: X, XI, XII" class="w-full border rounded-xl px-3 py-2 text-sm">
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl text-xs font-bold">Batal</button>
                        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Simpan</button>
                    </div>
                </form>
            `;
            openModal(html);

        async function importExcelGuru(e) {

                let json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                if(json.length > 0) {
                    try {
                        await fetch(`${STEIN}/guru`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(json)
                        });
                        alert(`Berhasil mengimpor ${json.length} data guru.`);
                        loadDataGuru(document.querySelector('.menu-btn'));
                    } catch(err) { alert("Gagal mengunggah ke server."); }
                }
            };
            reader.readAsArrayBuffer(file);

        function loadAbsensiQR(el) {

            area.innerHTML = `
                <div class="bg-white rounded-2xl shadow-xs border border-slate-200 p-6 max-w-xl mx-auto text-center">
                    <h3 class="text-lg font-black mb-2">Pindai QR Kartu Siswa</h3>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Jam Pelajaran ke-</label>

                        </div>
                    </div>
                    <div class="bg-slate-900 rounded-xl overflow-hidden aspect-video relative flex items-center justify-center mb-4">
                        <video id="qr-video" class="w-full h-full object-cover"></video>
                    </div>
                    <div id="scan-status" class="text-sm font-bold text-emerald-600"></div>
                </div>
            `;
            try {
                const codeReader = new ZXing.BrowserQRCodeReader();
                activeQRReader = codeReader;
                codeReader.decodeFromVideoDevice(null, 'qr-video', async (result, err) => {
                    if (result) {
                        let nisScanned = result.text;
                        let jam = document.getElementById('scan-jam').value;
                        let mapel = document.getElementById('scan-mapel').value;
                        await processAbsenScan(nisScanned, jam, mapel);
                    }
                });
            } catch(e) { console.error(e); }
        }

        async function processAbsenScan(nis, jam, mapel) {
            try {
                let res = await fetch(`${STEIN}/siswa`);
                let listSiswa = await res.json();
                let siswa = listSiswa.find(s => s.nis === nis);
                if(!siswa) {
                    alert("Siswa dengan NIS " + nis + " tidak ditemukan dalam database.");
                    return;
                }

                let payload = {
                    nis: siswa.nis,
                    nama: siswa.nama,
                    rombel: siswa.rombel,
                    tanggal: new Date().toISOString().split('T')[0],
                    jam_pelajaran: jam,
                    mapel: mapel,
                    status: "Hadir"
                };

                await fetch(`${STEIN}/absensi`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify([payload])
                });

                document.getElementById('scan-status').innerText = `Berhasil Absen: ${siswa.nama} (${siswa.rombel}) - Hadir`;
                setTimeout(() => { document.getElementById('scan-status').innerText = ''; }, 4000);
            } catch(e) { alert("Gagal merekam absensi."); }
        }

                                <button onclick="inputAbsenManual('${s.nis}', '${s.nama}', '${s.rombel}', 'Izin')" class="bg-blue-50 text-blue-700 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-xs font-bold transition">Izin</button>
                                <button onclick="inputAbsenManual('${s.nis}', '${s.nama}', '${s.rombel}', 'Sakit')" class="bg-amber-50 text-amber-700 hover:bg-amber-100 px-3 py-1.5 rounded-lg text-xs font-bold transition">Sakit</button>
                                <button onclick="inputAbsenManual('${s.nis}', '${s.nama}', '${s.rombel}', 'Alfa')" class="bg-rose-50 text-rose-700 hover:bg-rose-100 px-3 py-1.5 rounded-lg text-xs font-bold transition">Alfa</button>
                            </td>
                        </tr>`;
                    });
                }
                html += `</tbody></table></div>`;
                area.innerHTML = html;
            } catch(e) { area.innerHTML = `<div class="p-4 text-rose-600">Gagal memuat data belum absen.</div>`; }
        }

        async function inputAbsenManual(nis, nama, rombel, status) {
            let payload = {
                nis: nis,
                nama: nama,
                rombel: rombel,
                tanggal: new Date().toISOString().split('T')[0],
                jam_pelajaran: "1",
                mapel: "Umum",
                status: status
            };
            try {
                await fetch(`${STEIN}/absensi`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify([payload])
                });
                loadBelumAbsen(document.querySelector('.menu-btn'));
            } catch(e) { alert("Gagal menyimpan status absen manual."); }
        }

        // --- 8. REKAP ABSENSI, FILTER, EXCEL, SHARE WA ---
        let globalRekapData = [];
        async function loadRekapAbsensi(el) {
            setMenuActive(el);
            let area = document.getElementById('main-content-container');
            area.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-indigo-600 text-2xl"></i></div>`;
            try {
                let res = await fetch(`${STEIN}/absensi`);
                globalRekapData = await res.json() || [];
                renderRekapTable(globalRekapData);
            } catch(e) { area.innerHTML = `<div class="p-4 text-rose-600">Gagal memuat rekap absensi.</div>`; }
        }

        function renderRekapTable(data) {
            let area = document.getElementById('main-content-container');
            let html = `
                <div class="bg-white rounded-2xl shadow-xs border border-slate-200 p-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                        <h3 class="text-lg font-black text-slate-800">Rekapitulasi Absensi</h3>
                        <div class="flex gap-2">
                            <button onclick="exportExcelRekap()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition"><i class="fa-solid fa-file-excel mr-1"></i> Download Excel</button>
                            <button onclick="shareWhatsApp()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition"><i class="fa-brands fa-whatsapp mr-1"></i> Share WA</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <input type="date" id="filter-tgl" oninput="filterRekap()" class="border rounded-xl px-3 py-2 text-sm bg-white">
                        <input type="text" id="filter-nama" oninput="filterRekap()" placeholder="Cari Nama Siswa..." class="border rounded-xl px-3 py-2 text-sm bg-white">
                        <input type="text" id="filter-rombel" oninput="filterRekap()" placeholder="Cari Rombel..." class="border rounded-xl px-3 py-2 text-sm bg-white">
                    </div>
                    <div class="overflow-x-auto">
                        <table id="table-rekap" class="w-full text-left text-sm divide-y divide-slate-100">
                            <thead>
                                <tr class="bg-slate-50 text-slate-400 text-xs uppercase">
                                    <th class="p-3">Tanggal</th><th class="p-3">NIS</th><th class="p-3">Nama</th><th class="p-3">Rombel</th><th class="p-3">Jam & Mapel</th><th class="p-3">Status</th>
                                </tr>
                            </thead>
                            <tbody id="rekap-tbody">
            `;
            if(!data || data.length === 0) {
                html += `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada data rekap.</td></tr>`;
            } else {
                data.forEach(r => {
                    html += `<tr>
                        <td class="p-3">${r.tanggal || '-'}</td>
                        <td class="p-3">${r.nis || '-'}</td>
                        <td class="p-3 font-bold">${r.nama || '-'}</td>
                        <td class="p-3">${r.rombel || '-'}</td>
                        <td class="p-3">Jam ke-${r.jam_pelajaran || '-'} (${r.mapel || '-'})</td>
                        <td class="p-3"><span class="bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded text-xs font-bold">${r.status || '-'}</span></td>
                    </tr>`;
                });
            }
            html += `</tbody></table></div></div>`;
            area.innerHTML = html;
        }

        function filterRekap() {
            let tgl = document.getElementById('filter-tgl').value;
            let nama = document.getElementById('filter-nama').value.toLowerCase();
            let rombel = document.getElementById('filter-rombel').value.toLowerCase();

            let filtered = globalRekapData.filter(r => {
                let matchTgl = tgl ? r.tanggal === tgl : true;
                let matchNama = nama ? (r.nama || '').toLowerCase().includes(nama) : true;
                let matchRombel = rombel ? (r.rombel || '').toLowerCase().includes(rombel) : true;
                return matchTgl && matchNama && matchRombel;
            });

            let tbody = document.getElementById('rekap-tbody');
            if(!filtered || filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Tidak ditemukan data yang sesuai filter.</td></tr>`;
                return;
            }
            let html = '';
            filtered.forEach(r => {
                html += `<tr>
                    <td class="p-3">${r.tanggal || '-'}</td>
                    <td class="p-3">${r.nis || '-'}</td>
                    <td class="p-3 font-bold">${r.nama || '-'}</td>
                    <td class="p-3">${r.rombel || '-'}</td>
                    <td class="p-3">Jam ke-${r.jam_pelajaran || '-'} (${r.mapel || '-'})</td>
                    <td class="p-3"><span class="bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded text-xs font-bold">${r.status || '-'}</span></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function exportExcelRekap() {
            let tbl = document.getElementById("table-rekap");
            let wb = XLSX.utils.table_to_book(tbl, {sheet: "Rekap"});
            XLSX.writeFile(wb, "Rekap_Absensi.xlsx");
        }

        function shareWhatsApp() {
            let msg = encodeURIComponent("REKAPITULASI ABSENSI KELAS\nTanggal: " + new Date().toLocaleDateString() + "\nData kehadiran siswa telah direkap secara otomatis melalui sistem.");
            window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
