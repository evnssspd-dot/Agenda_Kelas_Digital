<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Agenda & Absensi Kelas - SteinHQ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Pro/Free -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (XLSX) untuk Export Excel & Import -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- HTML5-Qrcode untuk Scan Kamera -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script>
        const STEIN_URL = "https://api.steinhq.com/v1/storages/6a70b66092b1163e9728b63a";
    </script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center bg-gradient-to-tr from-blue-900 via-indigo-900 to-slate-900 p-4">
        <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl max-w-md w-full p-8 border border-white/20">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full text-2xl mb-4 shadow-inner">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Sistem Agenda & Absensi</h1>
                <p class="text-sm text-slate-500 mt-1">Silakan masuk sesuai hak akses Anda</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Username / Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user"></i></span>
                        <input type="text" id="loginUser" required placeholder="Masukkan username..." class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" id="loginPass" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition transform active:scale-95">Masuk Aplikasi</button>
            </form>
            <div class="mt-6 text-center text-xs text-slate-400">
                Terhubung ke Database Stein HQ &bull; v2.5 Enterprise
            </div>
        </div>
    </div>

    <!-- HALAMAN UTAMA APLIKASI -->
    <div id="appPage" class="hidden min-h-screen flex flex-col">
        <!-- Top Navigation -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="text-slate-600 hover:text-blue-600 md:hidden p-2"><i class="fa-solid fa-bars text-xl"></i></button>
                    <div class="flex items-center space-x-2">
                        <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold"><i class="fa-solid fa-school-flag"></i></div>
                        <span id="schoolNameHeader" class="font-bold text-lg text-slate-800">SMA Negeri / Swasta</span>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-right hidden sm:block">
                        <div id="userNameDisplay" class="text-sm font-bold text-slate-700">Nama Pengguna</div>
                        <div id="userRoleBadge" class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full inline-block">Role</div>
                    </div>
                    <button onclick="logout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3.5 py-2 rounded-xl text-sm font-semibold transition flex items-center"><i class="fa-solid fa-power-off mr-1.5"></i>Logout</button>
                </div>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- Sidebar -->
            <aside id="sidebar" class="bg-white w-70 border-r border-slate-200 hidden md:block overflow-y-auto transition-all p-4 space-y-1 z-20">
                <div id="sidebarMenu" class="space-y-1">
                    <!-- Dinamis via JS -->
                </div>
            </aside>

            <!-- Main Content Container -->
            <main class="flex-1 p-6 overflow-y-auto bg-slate-100" id="mainContent">
                <!-- Konten Halaman Aktif -->
            </main>
        </div>
    </div>

    <!-- MODAL POPUP GLOBAL / SCANNER -->
    <div id="modalContainer" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-100 animate-in fade-in zoom-in duration-200">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Modal Title</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="modalBody">
                <!-- Konten Modal Dinamis -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT UTAMA -->
    <script>
        let currentUser = null;
        let html5QrCode = null;

        // Helper Fetch Stein API
        async function fetchStein(table, method = 'get', data = null, condition = null) {
            let url = `${STEIN_URL}/${table}`;
            try {
                if (method === 'get') {
                    let res = await fetch(url);
                    return await res.json();
                } else if (method === 'post') {
                    let res = await fetch(url, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });
                    return await res.json();
                } else if (method === 'put') {
                    let res = await fetch(url, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({condition: condition, set: data})
                    });
                    return await res.json();
                } else if (method === 'delete') {
                    let res = await fetch(url, {
                        method: 'DELETE',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(condition)
                    });
                    return await res.json();
                }
            } catch (err) {
                console.error("Stein API Error:", err);
                alert("Koneksi ke server Stein HQ bermasalah.");
                return [];
            }
        }

        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();

            const users = await fetchStein('users');
            const found = users.find(x => x.username === u && x.password === p);

            if (found) {
                currentUser = found;
                localStorage.setItem('user', JSON.stringify(found));
                initApp();
            } else {
                alert("Username atau Password salah!");
            }
        }

        function logout() {
            localStorage.removeItem('user');
            location.reload();
        }

        window.onload = () => {
            const saved = localStorage.getItem('user');
            if (saved) {
                currentUser = JSON.parse(saved);
                initApp();
            }
        }

        function initApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('appPage').classList.remove('hidden');
            document.getElementById('userRoleBadge').innerText = currentUser.role.toUpperCase();
            document.getElementById('userNameDisplay').innerText = currentUser.nama || currentUser.username;
            
            loadProfilHeader();
            renderSidebar();
            loadDashboard();
        }

        async function loadProfilHeader() {
            let profil = await fetchStein('profil');
            if(profil && profil.length > 0) {
                document.getElementById('schoolNameHeader').innerText = profil[0].nama_sekolah || "Agenda & Absensi";
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        function renderSidebar() {
            const menu = document.getElementById('sidebarMenu');
            let html = '';
            const createBtn = (icon, label, func) => `
                <button onclick="${func}; if(window.innerWidth < 768) toggleSidebar();" class="w-full text-left px-4 py-3 rounded-xl hover:bg-blue-50 text-slate-600 hover:text-blue-600 font-medium transition flex items-center space-x-3 group">
                    <span class="w-8 h-8 rounded-lg bg-slate-100 group-hover:bg-blue-100 text-slate-500 group-hover:text-blue-600 flex items-center justify-center transition"><i class="${icon}"></i></span>
                    <span class="text-sm">${label}</span>
                </button>
            `;

            if (currentUser.role === 'admin') {
                html += createBtn('fa-solid fa-chart-pie', 'Dashboard Admin', 'loadAdminDashboard');
                html += createBtn('fa-solid fa-user-graduate', 'Data Siswa', 'loadDataSiswa');
                html += createBtn('fa-solid fa-school', 'Data Kelas / Rombel', 'loadDataKelas');
                html += createBtn('fa-solid fa-chalkboard-user', 'Data Guru', 'loadDataGuru');
                html += createBtn('fa-solid fa-user-tie', 'Wali Kelas', 'loadWaliKelas');
                html += createBtn('fa-solid fa-calendar-days', 'Periode Tahun Ajaran', 'loadPeriode');
                html += createBtn('fa-solid fa-users-gear', 'Manajemen User', 'loadManajemenUser');
                html += createBtn('fa-solid fa-building-columns', 'Profil Sekolah', 'loadProfilSekolah');
            } else {
                html += createBtn('fa-solid fa-chart-line', 'Dashboard Guru', 'loadGuruDashboard');
                html += createBtn('fa-solid fa-book', 'Data Mapel', 'loadGuruMapel');
                html += createBtn('fa-solid fa-user-group', 'Data Siswa Per Rombel', 'loadGuruSiswa');
                html += createBtn('fa-solid fa-qrcode', 'Absensi & QR Scan', 'loadGuruAbsen');
                html += createBtn('fa-solid fa-user-clock', 'Belum Absen', 'loadGuruBelumAbsen');
                html += createBtn('fa-solid fa-file-excel', 'Rekap Absensi', 'loadGuruRekap');
            }
            menu.innerHTML = html;
        }

        function loadDashboard() {
            if (currentUser.role === 'admin') loadAdminDashboard();
            else loadGuruDashboard();
        }

        // ================= ADMIN MODULES =================
        function loadAdminDashboard() {
            document.getElementById('mainContent').innerHTML = `
                <div class="space-y-6">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-800">Dashboard Administrator</h1>
                        <p class="text-sm text-slate-500">Kelola data master akademik dan pengguna sistem sekolah.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-200 flex items-center space-x-4">
                            <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center text-2xl"><i class="fa-solid fa-users"></i></div>
                            <div><div class="text-slate-500 text-sm font-medium">Total Siswa</div><div id="statSiswa" class="text-2xl font-bold text-slate-800">0</div></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-200 flex items-center space-x-4">
                            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl"><i class="fa-solid fa-chalkboard-user"></i></div>
                            <div><div class="text-slate-500 text-sm font-medium">Total Guru</div><div id="statGuru" class="text-2xl font-bold text-slate-800">0</div></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-xs border border-slate-200 flex items-center space-x-4">
                            <div class="w-14 h-14 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center text-2xl"><i class="fa-solid fa-school"></i></div>
                            <div><div class="text-slate-500 text-sm font-medium">Total Kelas</div><div id="statKelas" class="text-2xl font-bold text-slate-800">0</div></div>
                        </div>
                    </div>
                </div>
            `;
            updateAdminStats();
        }

        async function updateAdminStats() {
            let s = await fetchStein('siswa');
            let g = await fetchStein('guru');
            let k = await fetchStein('kelas');
            if(document.getElementById('statSiswa')) document.getElementById('statSiswa').innerText = s.length || 0;
            if(document.getElementById('statGuru')) document.getElementById('statGuru').innerText = g.length || 0;
            if(document.getElementById('statKelas')) document.getElementById('statKelas').innerText = k.length || 0;
        }

        // --- 1. DATA SISWA ---
        async function loadDataSiswa() {
            let data = await fetchStein('siswa');
            let html = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div><h1 class="text-2xl font-bold text-slate-800">Manajemen Data Siswa</h1><p class="text-sm text-slate-500">Tambah manual, upload foto, atau import dari Excel.</p></div>
                        <div class="flex items-center space-x-3">
                            <input type="file" id="excelSiswa" class="hidden" onchange="importExcelSiswa(this)">
                            <button onclick="document.getElementById('excelSiswa').click()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow-sm flex items-center"><i class="fa-solid fa-file-excel mr-2"></i>Import Excel</button>
                            <button onclick="openFormSiswa()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow-sm flex items-center"><i class="fa-solid fa-plus mr-2"></i>Tambah Siswa</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto"><table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase font-semibold"><th class="p-4">Foto</th><th class="p-4">NIS</th><th class="p-4">Nama Siswa</th><th class="p-4">Rombel</th><th class="p-4 text-center">Aksi</th></tr></thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
            `;
            if(data.length === 0) {
                html += `<tr><td colspan="5" class="p-8 text-center text-slate-400">Belum ada data siswa.</td></tr>`;
            } else {
                data.forEach((s) => {
                    html += `
                        <tr class="hover:bg-slate-50/50">
                            <td class="p-4"><img src="${s.foto || 'https://via.placeholder.com/150'}" class="w-10 h-10 object-cover rounded-xl border"></td>
                            <td class="p-4 font-semibold text-slate-700">${s.nis}</td>
                            <td class="p-4">${s.nama}</td>
                            <td class="p-4"><span class="px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs font-bold">${s.rombel}</span></td>
                            <td class="p-4 text-center space-x-2">
                                <button onclick="openFormSiswa('${s.nis}', '${s.nama}', '${s.rombel}', '${s.foto}')" class="text-amber-600 hover:text-amber-800 p-1.5"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="hapusSiswa('${s.nis}')" class="text-rose-600 hover:text-rose-800 p-1.5"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }
            html += `</tbody></table></div></div></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        async function openFormSiswa(nis = '', nama = '', rombel = '', foto = '') {
            let kelasList = await fetchStein('kelas');
            let options = kelasList.map(k => `<option value="${k.nama_rombel}" ${rombel === k.nama_rombel ? 'selected' : ''}>${k.nama_rombel}</option>`).join('');
            
            let html = `
                <form onsubmit="submitFormSiswa(event, '${nis}')" class="space-y-4">
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">NIS</label><input type="text" id="inputNis" value="${nis}" ${nis ? 'readonly' : 'required'} class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl outline-none"></div>
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Lengkap</label><input type="text" id="inputNama" value="${nama}" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl outline-none"></div>
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Rombel / Kelas</label><select id="inputRombel" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl outline-none"><option value="">Pilih Rombel</option>${options}</select></div>
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Foto (Upload File / URL)</label><input type="file" id="inputFotoFile" onchange="convertImageToBase64(this)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"><input type="hidden" id="inputFotoUrl" value="${foto}"></div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition">Simpan Data Siswa</button>
                </form>
            `;
            showModal(nis ? 'Edit Data Siswa' : 'Tambah Data Siswa', html);
        }

        function convertImageToBase64(element) {
            let file = element.files[0];
            let reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById('inputFotoUrl').value = reader.result;
            }
            reader.readAsDataURL(file);
        }

        async function submitFormSiswa(e, oldNis) {
            e.preventDefault();
            let nis = document.getElementById('inputNis').value;
            let nama = document.getElementById('inputNama').value;
            let rombel = document.getElementById('inputRombel').value;
            let foto = document.getElementById('inputFotoUrl').value;

            if(oldNis) {
                await fetchStein('siswa', 'put', {nama, rombel, foto}, {nis: oldNis});
            } else {
                await fetchStein('siswa', 'post', [{nis, nama, rombel, foto}]);
            }
            closeModal();
            loadDataSiswa();
        }

        async function hapusSiswa(nis) {
            if(confirm("Hapus data siswa ini?")) {
                await fetchStein('siswa', 'delete', null, {nis: nis});
                loadDataSiswa();
            }
        }

        async function importExcelSiswa(input) {
            let file = input.files[0];
            let reader = new FileReader();
            reader.onload = async function(e) {
                let data = new Uint8Array(e.target.result);
                let workbook = XLSX.read(data, {type: 'array'});
                let json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                await fetchStein('siswa', 'post', json);
                alert("Import siswa berhasil!");
                loadDataSiswa();
            };
            reader.readAsArrayBuffer(file);
        }

        // --- 2. DATA KELAS ---
        async function loadDataKelas() {
            let data = await fetchStein('kelas');
            let html = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div><h1 class="text-2xl font-bold text-slate-800">Manajemen Data Kelas / Rombel</h1><p class="text-sm text-slate-500">Kelola rombongan belajar tingkat sekolah.</p></div>
                        <button onclick="openFormKelas()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow-sm flex items-center"><i class="fa-solid fa-plus mr-2"></i>Tambah Kelas</button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead><tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase font-semibold"><th class="p-4">Nama Rombel / Kelas</th><th class="p-4">Tingkat</th><th class="p-4 text-center">Aksi</th></tr></thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
            `;
            if(data.length === 0) html += `<tr><td colspan="3" class="p-8 text-center text-slate-400">Belum ada data kelas.</td></tr>`;
            else {
                data.forEach(k => {
                    html += `
                        <tr class="hover:bg-slate-50/50">
                            <td class="p-4 font-semibold text-slate-700">${k.nama_rombel}</td>
                            <td class="p-4">${k.tingkat || '-'}</td>
                            <td class="p-4 text-center space-x-2">
                                <button onclick="openFormKelas('${k.nama_rombel}', '${k.tingkat}')" class="text-amber-600 hover:text-amber-800 p-1.5"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="hapusKelas('${k.nama_rombel}')" class="text-rose-600 hover:text-rose-800 p-1.5"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }
            html += `</tbody></table></div></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        function openFormKelas(nama = '', tingkat = '') {
            let html = `
                <form onsubmit="submitFormKelas(event, '${nama}')" class="space-y-4">
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Rombel</label><input type="text" id="namaRombel" value="${nama}" required class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl outline-none"></div>
                    <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tingkat</label><input type="text" id="tingkatKelas" value="${tingkat}" placeholder="Contoh: X, XI, XII" class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl outline-none"></div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transition">Simpan Kelas</button>
                </form>
            `;
            showModal(nama ? 'Edit Kelas' : 'Tambah Kelas', html);
        }

        async function submitFormKelas(e, oldName) {
            e.preventDefault();
            let nama_rombel = document.getElementById('namaRombel').value;
            let tingkat = document.getElementById('tingkatKelas').value;
            if(oldName) {
                await fetchStein('kelas', 'put', {nama_rombel, tingkat}, {nama_rombel: oldName});
            } else {
                await fetchStein('kelas', 'post', [{nama_rombel, tingkat}]);
            }
            closeModal();
            loadDataKelas();
        }

        async function hapusKelas(nama) {
            if(confirm("Hapus kelas ini?")) {
                await fetchStein('kelas', 'delete', null, {nama_rombel: nama});
                loadDataKelas();
            }
        }

        // --- 3. DATA GURU ---
        async function loadDataGuru() {
            let data = await fetchStein('guru');

        function loadGuruAbsen() {
            document.getElementById('mainContent').innerHTML = `

            initScanner();

        function initScanner() {
            if (html5QrCode) { stopScanner(); }
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                async (decodedText) => {
                    await processScanResult(decodedText);
                },
                (errorMessage) => {}
            ).catch(err => { console.error("Kamera gagal dimulai", err); });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => { html5QrCode.clear(); }).catch(err => {});
            }
        }

        async function processScanResult(nis) {
            let siswaList = await fetchStein('siswa');
            let s = siswaList.find(x => x.nis === nis);
            if(!s) {
                alert(`NIS ${nis} tidak ditemukan dalam database siswa!`);
                return;
            }

            let today = new Date().toISOString().split('T')[0];
            let payload = [{
                nis: s.nis,
                nama: s.nama,
                rombel: s.rombel,
                tanggal: today,
                jam_pelajaran: "1",
                mapel: "Umum",
                status: "Hadir"
            }];
            await fetchStein('absensi', 'post', payload);
            alert(`Berhasil Absen: ${s.nama} (${s.rombel}) - Hadir`);
        }

                        <button onclick="shareWhatsAppSemua()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-sm flex items-center"><i class="fa-brands fa-whatsapp mr-2"></i>Share WA Grup</button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                        <table class="w-full text-left">
                            <thead><tr class="bg-slate-50 border-b text-xs uppercase text-slate-600"><th class="p-4">NIS</th><th class="p-4">Nama Siswa</th><th class="p-4">Rombel</th><th class="p-4 text-center">Aksi Manual (Hadir/Izin/Sakit/Alfa)</th></tr></thead>
                            <tbody class="divide-y text-sm">
            `;
            if(belumAbsen.length === 0) html += `<tr><td colspan="4" class="p-8 text-center text-slate-400">Semua siswa sudah melakukan absensi hari ini!</td></tr>`;
            else {
                belumAbsen.forEach(s => {
                    html += `
                        <tr class="hover:bg-slate-50">
                            <td class="p-4 font-semibold">${s.nis}</td>
                            <td class="p-4">${s.nama}</td>
                            <td class="p-4"><span class="px-2 py-1 bg-slate-100 rounded text-xs font-bold">${s.rombel}</span></td>
                            <td class="p-4 text-center space-x-1">
                                <button onclick="absenManual('${s.nis}', '${s.nama}', '${s.rombel}', 'Hadir')" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-xs">Hadir</button>
                                <button onclick="absenManual('${s.nis}', '${s.nama}', '${s.rombel}', 'Izin')" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-xs">Izin</button>
                                <button onclick="absenManual('${s.nis}', '${s.nama}', '${s.rombel}', 'Sakit')" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-xs">Sakit</button>
                                <button onclick="absenManual('${s.nis}', '${s.nama}', '${s.rombel}', 'Alfa')" class="bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-xs">Alfa</button>
                            </td>
                        </tr>
                    `;
                });
            }
            html += `</tbody></table></div></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        async function absenManual(nis, nama, rombel, status) {
            let today = new Date().toISOString().split('T')[0];
            let payload = [{
                nis: nis,
                nama: nama,
                rombel: rombel,
                tanggal: today,
                jam_pelajaran: "1",
                mapel: "Manual",
                status: status
            }];
            await fetchStein('absensi', 'post', payload);
            loadGuruBelumAbsen();
        }

        function shareWhatsAppSemua() {
            let text = `*REKAP ABSENSI HARIAN SISWA*%0ATanggal: ${new Date().toLocaleDateString('id-ID')}%0ASilakan cek rekap lengkap di portal sekolah.`;
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        }

        // --- REKAP ABSENSI & FILTER + EXCEL ---
        async function loadGuruRekap() {
            window.rekapDataGlobal = await fetchStein('absensi');
            renderTabelRekap(window.rekapDataGlobal);
        }

        function renderTabelRekap(data) {
            let html = `
                <div class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div><h1 class="text-2xl font-bold text-slate-800">Rekapitulasi Absensi</h1><p class="text-sm text-slate-500">Filter berdasarkan tanggal, nama, atau rombel dan download Excel.</p></div>
                        <button onclick="exportExcelRekap()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-semibold shadow-sm flex items-center"><i class="fa-solid fa-file-excel mr-2"></i>Download Excel</button>
                    </div>
                    <!-- Filter Bar -->
                    <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-200 grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div><label class="block text-xs uppercase font-semibold mb-1">Filter Tanggal</label><input type="date" id="filterTanggal" onchange="filterRekapData()" class="w-full p-2.5 border rounded-xl text-sm"></div>
                        <div><label class="block text-xs uppercase font-semibold mb-1">Cari Nama / NIS</label><input type="text" id="filterNama" onkeyup="filterRekapData()" placeholder="Ketik nama siswa..." class="w-full p-2.5 border rounded-xl text-sm"></div>
                        <div><label class="block text-xs uppercase font-semibold mb-1">Filter Rombel</label><input type="text" id="filterRombel" onkeyup="filterRekapData()" placeholder="Contoh: XII IPA" class="w-full p-2.5 border rounded-xl text-sm"></div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 overflow-hidden">
                        <table class="w-full text-left" id="tabelRekapExport">
                            <thead><tr class="bg-slate-50 border-b text-xs uppercase text-slate-600"><th class="p-4">Tanggal</th><th class="p-4">NIS</th><th class="p-4">Nama</th><th class="p-4">Rombel</th><th class="p-4">Jam Ke</th><th class="p-4">Mapel</th><th class="p-4">Status</th></tr></thead>
                            <tbody class="divide-y text-sm" id="rekapTbody">
            `;
            if(!data || data.length === 0) {
                html += `<tr><td colspan="7" class="p-8 text-center text-slate-400">Belum ada data rekap absensi.</td></tr>`;
            } else {
                data.forEach(a => {
                    let badgeColor = a.status === 'Hadir' ? 'bg-emerald-100 text-emerald-700' : (a.status === 'Sakit' ? 'bg-blue-100 text-blue-700' : (a.status === 'Izin' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'));
                    html += `
                        <tr>
                            <td class="p-4">${a.tanggal || '-'}</td>
                            <td class="p-4 font-semibold">${a.nis || '-'}</td>
                            <td class="p-4">${a.nama || '-'}</td>
                            <td class="p-4">${a.rombel || '-'}</td>
                            <td class="p-4">${a.jam_pelajaran || '1'}</td>
                            <td class="p-4">${a.mapel || '-'}</td>
                            <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${badgeColor}">${a.status}</span></td>
                        </tr>
                    `;
                });
            }
            html += `</tbody></table></div></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        function filterRekapData() {
            let tgl = document.getElementById('filterTanggal').value;
            let nama = document.getElementById('filterNama').value.toLowerCase();
            let rombel = document.getElementById('filterRombel').value.toLowerCase();

            let filtered = window.rekapDataGlobal.filter(item => {
                let matchTgl = tgl ? item.tanggal === tgl : true;
                let matchNama = nama ? (item.nama && item.nama.toLowerCase().includes(nama)) || (item.nis && item.nis.includes(nama)) : true;
                let matchRombel = rombel ? item.rombel && item.rombel.toLowerCase().includes(rombel) : true;
                return matchTgl && matchNama && matchRombel;
            });

            let tbody = document.getElementById('rekapTbody');
            let html = '';
            if(filtered.length === 0) {
                html = `<tr><td colspan="7" class="p-8 text-center text-slate-400">Data tidak ditemukan sesuai filter.</td></tr>`;
            } else {
                filtered.forEach(a => {
                    let badgeColor = a.status === 'Hadir' ? 'bg-emerald-100 text-emerald-700' : (a.status === 'Sakit' ? 'bg-blue-100 text-blue-700' : (a.status === 'Izin' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'));
                    html += `
                        <tr>
                            <td class="p-4">${a.tanggal || '-'}</td>
                            <td class="p-4 font-semibold">${a.nis || '-'}</td>
                            <td class="p-4">${a.nama || '-'}</td>
                            <td class="p-4">${a.rombel || '-'}</td>
                            <td class="p-4">${a.jam_pelajaran || '1'}</td>
                            <td class="p-4">${a.mapel || '-'}</td>
                            <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${badgeColor}">${a.status}</span></td>
                        </tr>
                    `;
                });
            }
            tbody.innerHTML = html;
        }

        function exportExcelRekap() {
            let table = document.getElementById("tabelRekapExport");
            let wb = XLSX.utils.table_to_book(table, {sheet: "Rekap Absensi"});
            XLSX.writeFile(wb, "Rekap_Absensi_Siswa.xlsx");
        }

        // --- MODAL UTILS ---
        function showModal(title, content) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modalContainer').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalContainer').classList.add('hidden');
        }
    </script>
</body>
</html>
