<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-browser-title">Aplikasi Agenda & Presensi Kelas Terpadu</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS untuk Ekspor & Impor Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- ZXing untuk QR Scanner Kamera -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <!-- QRCode Generator untuk Cetak Kartu -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Ukuran Kartu Pelajar Potrait (Tinggi 8.5 cm, Lebar 5.4 cm) */
        .card-portrait {
            width: 5.4cm;
            height: 8.5cm;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            color: white;
            box-sizing: border-box;
            page-break-after: always;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #print-card-area, #print-card-area * {
                visibility: visible;
            }
            #print-card-area {
                position: absolute;
                left: 0;
                top: 0;
                margin: 0;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800" onload="loadGlobalProfileMetadata()">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-950 p-4">
        <div class="bg-white/10 backdrop-blur-2xl border border-white/10 p-8 rounded-3xl shadow-2xl w-full max-w-md text-white">
            <div class="text-center mb-8">
                <div class="inline-block bg-indigo-600 p-4 rounded-2xl shadow-xl mb-3 text-white overflow-hidden w-16 h-16 flex items-center justify-center">
                    <img id="login-logo-img" src="" class="w-full h-full object-cover hidden" alt="Logo">
                    <i id="login-logo-icon" class="fa-solid fa-graduation-cap text-3xl"></i>
                </div>
                <h1 id="login-app-title" class="text-xl font-black tracking-wider">AGENDA & PRESENSI KELAS</h1>
                <p class="text-xs text-indigo-200 mt-1">Terhubung ke Database Stein HQ</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-indigo-200 mb-2">Username</label>
                    <input type="text" id="login-user" required placeholder="Masukkan username..." class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-indigo-200 mb-2">Password</label>
                    <input type="password" id="login-pass" required placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl shadow-lg transition duration-200 cursor-pointer text-sm">
                    Masuk ke Sistem
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen" class="min-h-screen flex flex-col hidden">
        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-4 md:px-6 sticky top-0 z-50 shadow-xs">
            <div class="flex items-center space-x-3">
                <button onclick="toggleMobileSidebar()" class="md:hidden text-slate-600 hover:text-indigo-600 p-2 rounded-xl focus:outline-none cursor-pointer">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <div class="bg-indigo-600 text-white w-9 h-9 rounded-xl shadow-sm flex items-center justify-center overflow-hidden shrink-0">
                    <img id="header-logo-img" src="" class="w-full h-full object-cover hidden" alt="Logo">
                    <i id="header-logo-icon" class="fa-solid fa-school text-sm"></i>
                </div>
                <div>
                    <h1 id="app-title-header" class="font-bold text-slate-800 text-xs md:text-sm truncate max-w-[140px] sm:max-w-xs">Agenda & Presensi</h1>
                    <span class="text-[10px] text-slate-400 block">Sistem Akademik</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <div class="text-right hidden sm:block">
                    <span id="user-display-name" class="block text-sm font-bold text-slate-800">-</span>
                    <span id="user-display-role" class="inline-block bg-indigo-50 text-indigo-700 text-xs px-2.5 py-0.5 rounded-full font-extrabold uppercase">-</span>
                </div>
                <button onclick="logoutApp()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold px-3 py-2 rounded-xl transition cursor-pointer">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> <span class="hidden sm:inline">Keluar</span>
                </button>
            </div>
        </header>

        <div class="flex flex-1 relative">
            <aside id="sidebar-container" class="w-72 bg-white border-r border-slate-200 p-4 space-y-1.5 hidden md:block shrink-0"></aside>
            <div id="mobile-sidebar-backdrop" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden backdrop-blur-xs" onclick="toggleMobileSidebar()"></div>
            <aside id="mobile-sidebar-container" class="fixed inset-y-0 left-0 w-72 bg-white border-r border-slate-200 p-4 space-y-1.5 z-50 transform -translate-x-full transition-transform duration-300 md:hidden flex flex-col shadow-2xl overflow-y-auto"></aside>
            <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full" id="main-content-container"></main>
        </div>
    </div>

    <!-- MODAL CONTAINER -->
    <div id="app-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center z-50 hidden p-4">
        <div id="modal-content" class="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-6 overflow-y-auto max-h-[90vh]"></div>
    </div>

    <!-- MAIN SCRIPT -->
    <script>
        const STEIN = "https://api.steinhq.com/v1/storages/6a70b66092b1163e9728b63a";
        let currentUser = null;
        let activeQRReader = null;
        let isCameraActive = false;
        let isScanningLocked = false;
        let globalSchoolProfile = {};

        async function loadGlobalProfileMetadata() {
            try {
                let res = await fetch(`${STEIN}/profil`);
                let data = await res.json();
                if(data && data.length > 0) {
                    globalSchoolProfile = data[0];
                    applyProfileBranding(globalSchoolProfile);
                }
            } catch(e) {}
        }

        function applyProfileBranding(p) {
            let appName = p.nama_aplikasi || "Agenda & Presensi Kelas";
            document.getElementById('page-browser-title').innerText = appName;
            let headerTitle = document.getElementById('app-title-header');
            if(headerTitle) headerTitle.innerText = appName;
            let loginAppTitle = document.getElementById('login-app-title');
            if(loginAppTitle) loginAppTitle.innerText = appName.toUpperCase();

            if(p.logo) {
                let hImg = document.getElementById('header-logo-img');
                let hIcon = document.getElementById('header-logo-icon');
                if(hImg && hIcon) {
                    hImg.src = p.logo;
                    hImg.classList.remove('hidden');
                    hIcon.classList.add('hidden');
                }
                let lImg = document.getElementById('login-logo-img');
                let lIcon = document.getElementById('login-logo-icon');
                if(lImg && lIcon) {
                    lImg.src = p.logo;
                    lImg.classList.remove('hidden');
                    lIcon.classList.add('hidden');
                }
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();

            try {
                let res = await fetch(`${STEIN}/users`);
                let users = await res.json();
                let found = users.find(x => x.username === u && x.password === p);

                if (found || (u === "admin" && p === "admin")) {
                    currentUser = found || { username: "admin", role: "admin", nama: "Administrator" };
                    await loadGlobalProfileMetadata();
                    initAppSession();
                } else {
                    alert("Username atau Password salah!");
                }
            } catch(err) {
                if(u === "admin" && p === "admin") {
                    currentUser = { username: "admin", role: "admin", nama: "Administrator" };
                    initAppSession();
                } else {
                    alert("Gagal terhubung ke server Stein HQ. Periksa koneksi internet.");
                }
            }
        }

        function initAppSession() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = currentUser.nama;
            document.getElementById('user-display-role').innerText = currentUser.role;
            buildSidebarMenu();
            loadDashboard();
        }

        function logoutApp() {
            stopCamera();
            currentUser = null;
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        function toggleMobileSidebar() {
            let mobileSb = document.getElementById('mobile-sidebar-container');
            let backdrop = document.getElementById('mobile-sidebar-backdrop');
            if(mobileSb.classList.contains('-translate-x-full')) {
                mobileSb.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                mobileSb.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function buildSidebarMenu() {
            let sbDesktop = document.getElementById('sidebar-container');
            let sbMobile = document.getElementById('mobile-sidebar-container');
            let role = (currentUser.role || '').toLowerCase();
            let html = '';

            if (role === 'admin') {
                html = `
                    <a href="#" onclick="handleMenuClick(loadDashboard, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition active"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span></a>
                    <a href="#" onclick="handleMenuClick(loadDataSiswa, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-users w-5"></i><span>Data Siswa</span></a>
                    <a href="#" onclick="handleMenuClick(loadDataKelas, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-door-open w-5"></i><span>Data Kelas</span></a>
                    <a href="#" onclick="handleMenuClick(loadDataGuru, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-chalkboard-user w-5"></i><span>Data Guru</span></a>
                    <a href="#" onclick="handleMenuClick(loadWaliKelas, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-user-tie w-5"></i><span>Wali Kelas</span></a>
                    <a href="#" onclick="handleMenuClick(loadPeriode, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-calendar-days w-5"></i><span>Periode Tahun Ajaran</span></a>
                    <a href="#" onclick="handleMenuClick(loadManajemenUser, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-shield-halved w-5"></i><span>Manajemen User</span></a>
                    <a href="#" onclick="handleMenuClick(loadProfilSekolah, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-school w-5"></i><span>Profil Sekolah</span></a>
                `;
            } else {
                html = `
                    <a href="#" onclick="handleMenuClick(loadDashboard, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition active"><i class="fa-solid fa-house w-5"></i><span>Dashboard Guru</span></a>
                    <a href="#" onclick="handleMenuClick(loadMapelGuru, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-book w-5"></i><span>Data Mapel Saya</span></a>
                    <a href="#" onclick="handleMenuClick(loadDataSiswa, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-user-group w-5"></i><span>Data Siswa Per Rombel</span></a>
                    <a href="#" onclick="handleMenuClick(loadAbsensiQR, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-qrcode w-5"></i><span>Absensi & QR Scan</span></a>
                    <a href="#" onclick="handleMenuClick(loadBelumAbsen, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-user-clock w-5"></i><span>Belum Absen</span></a>
                    <a href="#" onclick="handleMenuClick(loadRekapAbsensi, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-file-excel w-5"></i><span>Rekap Absensi</span></a>
                    <a href="#" onclick="handleMenuClick(loadProfilSekolah, this)" class="menu-btn flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 font-semibold transition"><i class="fa-solid fa-school w-5"></i><span>Profil Sekolah</span></a>
                `;
            }
            sbDesktop.innerHTML = html;
            sbMobile.innerHTML = `
                <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-2">
                    <div>
                        <span class="block text-sm font-bold text-slate-800">${currentUser.nama}</span>
                        <span class="inline-block bg-indigo-50 text-indigo-700 text-[10px] px-2 py-0.5 rounded-full font-extrabold uppercase mt-0.5">${currentUser.role}</span>
                    </div>
                    <button onclick="toggleMobileSidebar()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-base"></i></button>
                </div>
                ${html}
            `;
        }

        function handleMenuClick(callback, el) {
            if(window.innerWidth < 768) toggleMobileSidebar();
            callback(el);
        }

        function setMenuActive(el) {
            stopCamera();
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('bg-indigo-50', 'text-indigo-600', 'active'));
            if(el) {
                let text = el.innerText.trim();
                document.querySelectorAll('.menu-btn').forEach(b => {
                    if(b.innerText.trim() === text) b.classList.add('bg-indigo-50', 'text-indigo-600', 'active');
                });
            }
        }

        function closeModal() { document.getElementById('app-modal').classList.add('hidden'); }
        function openModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('app-modal').classList.remove('hidden');
        }

        async function loadDashboard(el) {
            setMenuActive(el);
            let area = document.getElementById('main-content-container');
            area.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-indigo-900 to-violet-900 text-white p-6 md:p-8 rounded-3xl shadow-xl">
                        <h2 class="text-xl md:text-2xl font-black mb-2">Selamat Datang, ${currentUser.nama}</h2>
                        <p class="text-indigo-200 text-xs md:text-sm max-w-2xl leading-relaxed">
                            Kelola agenda kelas, pindai kehadiran QR siswa dengan kontrol kamera, cetak kartu pelajar format potrait presisi, dan bagikan rekap laporan langsung ke WhatsApp.
                        </p>
                    </div>
                </div>
            `;
        }

        // --- DATA SISWA & CETAK KARTU POTRAIT ---
        async function loadDataSiswa(el) {
            setMenuActive(el);
            let area = document.getElementById('main-content-container');
            area.innerHTML = `<div class="text-center py-12"><i class="fa-solid fa-spinner fa-spin text-indigo-600 text-2xl"></i><p class="text-xs text-slate-400 mt-2">Memuat data...</p></div>`;
            try {
                let res = await fetch(`${STEIN}/siswa`);
                let data = await res.json();
                let html = `
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 p-4 md:p-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                            <div>
                                <h3 class="text-base md:text-lg font-black text-slate-800">Data Siswa & Cetak Kartu</h3>
                                <p class="text-xs text-slate-400">Kelola informasi siswa, cetak kartu QR Potrait ukuran 8.5x5.4 cm.</p>
                            </div>
                            <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                                <label class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl cursor-pointer transition text-center flex-1 sm:flex-none">
                                    <i class="fa-solid fa-file-excel mr-1"></i> Import Excel
                                    <input type="file" accept=".xlsx, .xls" class="hidden" onchange="importExcelSiswa(event)">
                                </label>
                                ${currentUser.role.toLowerCase() === 'admin' ? `<button onclick="openFormSiswa()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl flex-1 sm:flex-none"><i class="fa-solid fa-plus mr-1"></i> Tambah Siswa</button>` : ''}
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm min-w-[600px]">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-400 text-xs uppercase border-b border-slate-100">
                                        <th class="p-3">Foto</th>
                                        <th class="p-3">NIS</th>
                                        <th class="p-3">Nama</th>
                                        <th class="p-3">Rombel</th>
                                        <th class="p-3">Aksi & Kartu QR</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                `;
                if (!data || data.length === 0) {
                    html += `<tr><td colspan="5" class="p-4 text-center text-slate-400">Belum ada data siswa.</td></tr>`;
                } else {
                    data.forEach((s) => {
                        html += `
                            <tr>
                                <td class="p-3"><img src="${s.foto || 'https://via.placeholder.com/40'}" class="w-9 h-9 rounded-full object-cover border"></td>
                                <td class="p-3 font-semibold">${s.nis || '-'}</td>
                                <td class="p-3 font-bold">${s.nama || '-'}</td>
                                <td class="p-3"><span class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md text-xs font-bold">${s.rombel || '-'}</span></td>
                                <td class="p-3 flex items-center gap-2">
                                    <button onclick='openCetakKartu(${JSON.stringify(s)})' class="bg-violet-50 hover:bg-violet-100 text-violet-700 px-3 py-1.5 rounded-lg text-xs font-bold transition"><i class="fa-solid fa-id-card mr-1"></i> Kartu</button>
                                    ${currentUser.role.toLowerCase() === 'admin' ? `
                                        <button onclick='openFormSiswa(${JSON.stringify(s)})' class="text-blue-600 hover:bg-blue-50 p-2 rounded-lg transition"><i class="fa-solid fa-pen"></i></button>
                                        <button onclick="hapusSiswa('${s.nis}')" class="text-rose-600 hover:bg-rose-50 p-2 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
                                    ` : ''}
                                </td>
                            </tr>
                        `;
                    });
                }
                html += `</tbody></table></div></div>`;
                area.innerHTML = html;
            } catch(e) {
                area.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 rounded-xl text-sm">Gagal memuat sheet siswa.</div>`;
            }
        }

        function openCetakKartu(s) {
            let schoolLogo = globalSchoolProfile.logo || 'https://via.placeholder.com/30';
            let nisnVal = s.nisn || '0132345674';

            let html = `
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-base md:text-lg font-black text-slate-800">Cetak Kartu Tanda Pelajar</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="flex justify-center my-4">
                    <div id="print-card-area" class="card-portrait p-4 rounded-2xl shadow-2xl flex flex-col justify-between items-center text-center relative overflow-hidden border border-white/20">
                        <div class="absolute -right-10 -top-10 w-24 h-24 bg-indigo-500/20 rounded-full blur-xl"></div>
                        
                        <!-- Header: Logo di kiri, Teks Kartu Tanda Pelajar -->
                        <div class="w-full flex items-center justify-center space-x-2 border-b border-white/10 pb-2">
                            <img src="${schoolLogo}" class="w-6 h-6 rounded-full object-cover bg-white p-0.5 shadow">
                            <span class="text-[10px] font-black tracking-wider uppercase text-indigo-200">Kartu Tanda Pelajar</span>
                        </div>

                        <!-- Tengah: Foto Pelajar Lingkaran Sempurna Tanpa Terpotong -->
                        <div class="flex flex-col items-center my-auto w-full">
                            <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-indigo-400/50 shadow-md mb-2 bg-slate-800 shrink-0">
                                <img src="${s.foto || 'https://via.placeholder.com/80'}" class="w-full h-full object-cover">
                            </div>
                            <h2 class="text-xs font-extrabold text-white truncate max-w-[180px] mb-0.5">${s.nama}</h2>
                            <p class="text-[10px] text-indigo-200 font-medium">${s.nis} / ${nisnVal}</p>
                        </div>

                        <!-- Bawah: Kode QR Tepat di Tengah -->
                        <div class="w-full flex flex-col items-center mt-1">
                            <div class="bg-white p-2 rounded-xl shadow-inner inline-block" id="qrcode-container"></div>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-xl text-xs font-bold text-slate-600">Tutup</button>
                    <button onclick="window.print()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold hover:bg-indigo-700"><i class="fa-solid fa-print mr-1"></i> Cetak Kartu</button>
                </div>
            `;
            openModal(html);
            setTimeout(() => {

        async function importExcelSiswa(e) {
            let file = e.target.files[0];
            let reader = new FileReader();
            reader.onload = async function(evt) {
                let data = new Uint8Array(evt.target.result);
                let wb = XLSX.read(data, {type: 'array'});
                let json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                if(json.length > 0) {
                    try {
                        await fetch(`${STEIN}/siswa`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(json)
                        });
                        alert(`Berhasil mengimpor ${json.length} data siswa.`);
                        loadDataSiswa(document.querySelector('.menu-btn'));
                    } catch(err) { alert("Gagal mengunggah data Excel ke server."); }
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function startCamera() {
            try {
                const codeReader = new ZXing.BrowserQRCodeReader();
                activeQRReader = codeReader;
                isCameraActive = true;
                document.getElementById('cam-placeholder').classList.add('hidden');
                document.getElementById('btn-start-cam').classList.add('hidden');
                document.getElementById('btn-stop-cam').classList.remove('hidden');

                codeReader.decodeFromVideoDevice(null, 'qr-video', async (result, err) => {
                    if (result && isCameraActive && !isScanningLocked) {
                        isScanningLocked = true;
                        let nisScanned = result.text;
                        let jam = document.getElementById('scan-jam').value;
                        let mapel = document.getElementById('scan-mapel').value;
                        await processAbsenScan(nisScanned, jam, mapel);
                        setTimeout(() => { isScanningLocked = false; }, 3000);
                    }
                });
            } catch(e) {
                alert("Tidak dapat mengakses kamera perangkat.");
                stopCamera();
            }
        }

        function stopCamera() {
            isCameraActive = false;
            isScanningLocked = false;
            if(activeQRReader) {
                try { activeQRReader.reset(); } catch(e){}
                activeQRReader = null;
            }
            let videoEl = document.getElementById('qr-video');
            if(videoEl && videoEl.srcObject) {
                let stream = videoEl.srcObject;
                let tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
                videoEl.srcObject = null;
            }
            let camPlaceholder = document.getElementById('cam-placeholder');
            if(camPlaceholder) camPlaceholder.classList.remove('hidden');
            let btnStart = document.getElementById('btn-start-cam');
            let btnStop = document.getElementById('btn-stop-cam');
            if(btnStart) btnStart.classList.remove('hidden');
            if(btnStop) btnStop.classList.add('hidden');
        }

        async function processAbsenScan(nis, jam, mapel) {
            let statusBox = document.getElementById('scan-status');
            try {
                let today = new Date().toISOString().split('T')[0];
                let resSiswa = await fetch(`${STEIN}/siswa`);
                let listSiswa = await resSiswa.json();
                let siswa = listSiswa.find(s => String(s.nis).trim() === String(nis).trim());
                if(!siswa) {
                    statusBox.className = "p-4 rounded-xl text-sm font-bold bg-rose-50 text-rose-700 border border-rose-200 block";
                    statusBox.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> Siswa dengan NIS ${nis} tidak ditemukan!`;
                    return;
                }

                let payload = {
                    nis: siswa.nis,
                    nama: siswa.nama,
                    rombel: siswa.rombel,
                    tanggal: today,
                    jam_pelajaran: jam,
                    mapel: mapel,
                    status: "Hadir"
                };

                await fetch(`${STEIN}/absensi`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify([payload])
                });

                statusBox.className = "p-4 rounded-xl text-sm font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 block";
                statusBox.innerHTML = `<i class="fa-solid fa-circle-check mr-1 text-base"></i> Berhasil Scan! <strong>${siswa.nama}</strong> (${siswa.rombel}) tercatat <strong>Hadir</strong>.`;
                setTimeout(() => { if(statusBox) statusBox.classList.add('hidden'); }, 4000);
            } catch(e) { 
                statusBox.className = "p-4 rounded-xl text-sm font-bold bg-rose-50 text-rose-700 border border-rose-200 block";
                statusBox.innerHTML = "Gagal merekam absensi.";
            }
        }
