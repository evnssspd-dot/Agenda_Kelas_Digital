<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Agenda & Absensi Kelas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS untuk Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- HTML5-Qrcode untuk Scan QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script>
        const STEIN_URL = "https://api.steinhq.com/v1/storages/6a70b66092b1163e9728b63a";
    </script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-indigo-800 p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8">
            <div class="text-center mb-8">
                <i class="fa-solid fa-graduation-cap text-4xl text-blue-600 mb-2"></i>
                <h1 class="text-2xl font-bold text-gray-800">Agenda & Absensi Kelas</h1>
                <p class="text-sm text-gray-500">Silakan login untuk melanjutkan</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username / Email</label>
                    <input type="text" id="loginUser" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="loginPass" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">Login</button>
            </form>
        </div>
    </div>

    <!-- HALAMAN UTAMA APLIKASI (DASHBOARD) -->
    <div id="appPage" class="hidden min-h-screen flex flex-col">
        <!-- Navbar -->
        <header class="bg-white shadow-sm z-10">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="text-gray-600 hover:text-blue-600 md:hidden"><i class="fa-solid fa-bars text-xl"></i></button>
                    <span id="schoolNameHeader" class="font-bold text-lg text-gray-800">Profil Sekolah</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="userRoleBadge" class="text-xs bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full font-semibold"></span>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800 text-sm font-medium"><i class="fa-solid fa-right-from-bracket mr-1"></i>Logout</button>
                </div>
            </div>
        </header>

        <div class="flex-1 flex">
            <!-- Sidebar -->
            <aside id="sidebar" class="bg-white w-64 border-r hidden md:block transition-all">
                <div id="sidebarMenu" class="p-4 space-y-2">
                    <!-- Dinamis berdasarkan Role (Admin / Guru) -->
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-1 p-6 overflow-y-auto" id="mainContent">
                <!-- Konten dinamis dirender lewat JavaScript -->
            </main>
        </div>
    </div>

    <!-- MODAL SCANNER QR -->
    <div id="qrModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-lg w-full p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Scan QR Code Siswa</h3>
                <button onclick="closeQrModal()" class="text-gray-500 hover:text-gray-700"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="reader" class="w-full"></div>
            <div class="mt-4 flex justify-end">
                <button onclick="closeQrModal()" class="bg-gray-300 px-4 py-2 rounded-lg text-gray-700">Tutup</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        let currentUser = null;

        async function fetchStein(table, method = 'get', data = null, condition = null) {
            let url = `${STEIN_URL}/${table}`;
            try {
                if (method === 'get') {
                    let res = await fetch(url);
                    return await res.json();
                } else if (method === 'post') {
                    let res = await fetch(url, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(data)
                    });
                    return await res.json();
                } else if (method === 'put') {
                    let res = await fetch(url, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({condition: condition, set: data})
                    });
                    return await res.json();
                } else if (method === 'delete') {
                    let res = await fetch(url, {
                        method: 'DELETE',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(condition)
                    });
                    return await res.json();
                }
            } catch (err) {
                console.error("Stein API Error:", err);
                alert("Gagal terhubung ke Database Stein HQ.");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;

            // Cek Manajemen User dari Stein HQ (Tabel: users)
            const users = await fetchStein('users');
            const found = users.find(x => x.username === u && x.password === p);

            if (found) {
                currentUser = found;
                localStorage.setItem('user', JSON.stringify(found));
                initApp();
            } else {
                alert("Username atau Password salah!");
            }
        }

        function logout() {
            localStorage.removeItem('user');
            location.reload();
        }

        window.onload = () => {
            const saved = localStorage.getItem('user');
            if (saved) {
                currentUser = JSON.parse(saved);
                initApp();
            }
        }

        function initApp() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('appPage').classList.remove('hidden');
            document.getElementById('userRoleBadge').innerText = currentUser.role.toUpperCase();
            
            renderSidebar();
            loadDashboard();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        function renderSidebar() {
            const menu = document.getElementById('sidebarMenu');
            let html = '';
            if (currentUser.role === 'admin') {
                html = `
                    <button onclick="loadAdminDashboard()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-chart-pie mr-2"></i>Dashboard</button>
                    <button onclick="loadDataSiswa()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-users mr-2"></i>Data Siswa</button>
                    <button onclick="loadDataKelas()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-school mr-2"></i>Data Kelas / Rombel</button>
                    <button onclick="loadDataGuru()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-chalkboard-user mr-2"></i>Data Guru</button>
                    <button onclick="loadWaliKelas()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-user-tie mr-2"></i>Wali Kelas</button>
                    <button onclick="loadPeriode()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-calendar-days mr-2"></i>Periode Tahun Ajaran</button>
                    <button onclick="loadManajemenUser()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-users-gear mr-2"></i>Manajemen User</button>
                    <button onclick="loadProfilSekolah()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-building-columns mr-2"></i>Profil Sekolah</button>
                `;
            } else {
                html = `
                    <button onclick="loadGuruDashboard()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-chart-line mr-2"></i>Dashboard</button>
                    <button onclick="loadGuruMapel()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-book mr-2"></i>Data Mapel</button>
                    <button onclick="loadGuruSiswa()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-user-group mr-2"></i>Data Siswa Per Rombel</button>
                    <button onclick="loadGuruAbsen()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-qrcode mr-2"></i>Absensi & QR Scan</button>
                    <button onclick="loadGuruBelumAbsen()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-user-clock mr-2"></i>Belum Absen</button>
                    <button onclick="loadGuruRekap()" class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 text-gray-700 font-medium"><i class="fa-solid fa-file-excel mr-2"></i>Rekap Absensi</button>
                `;
            }
            menu.innerHTML = html;
        }

        function loadDashboard() {
            if (currentUser.role === 'admin') loadAdminDashboard();
            else loadGuruDashboard();
        }

        // --- ADMIN MODULES ---
        function loadAdminDashboard() {
            document.getElementById('mainContent').innerHTML = `<h2 class="text-2xl font-bold mb-4">Dashboard Admin</h2><p>Selamat datang Administrator di Sistem Agenda & Absensi Kelas.</p>`;
        }

        async function loadDataSiswa() {
            let data = await fetchStein('siswa');
            let html = `<h2 class="text-2xl font-bold mb-4">Data Siswa</h2>
                <div class="mb-4 flex space-x-2">
                    <button onclick="openFormSiswa()" class="bg-blue-600 text-white px-4 py-2 rounded">Tambah Siswa</button>
                    <input type="file" id="excelSiswa" class="hidden" onchange="importExcelSiswa(this)">
                    <button onclick="document.getElementById('excelSiswa').click()" class="bg-green-600 text-white px-4 py-2 rounded">Import Excel</button>
                </div>
                <div class="bg-white rounded shadow overflow-x-auto"><table class="w-full text-left border-collapse">
                <thead><tr class="bg-gray-200 border-b">
                    <th class="p-3">Foto</th><th class="p-3">NIS</th><th class="p-3">Nama</th><th class="p-3">Rombel</th><th class="p-3">Aksi</th>
                </tr></thead><tbody>`;
            data.forEach((s, i) => {
                html += `<tr class="border-b">
                    <td class="p-3"><img src="${s.foto || 'https://via.placeholder.com/40'}" class="w-10 h-10 object-cover rounded-full"></td>
                    <td class="p-3">${s.nis}</td><td class="p-3">${s.nama}</td><td class="p-3">${s.rombel}</td>
                    <td class="p-3"><button onclick="hapusSiswa('${s.nis}')" class="text-red-600"><i class="fa-solid fa-trash"></i></button></td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        async function hapusSiswa(nis) {
            if(confirm('Hapus data siswa?')) {
                await fetchStein('siswa', 'delete', null, {nis: nis});
                loadDataSiswa();
            }
        }

        function openFormSiswa() {
            let html = `<h2 class="text-2xl font-bold mb-4">Form Tambah Siswa</h2>
                <form onsubmit="simpanSiswa(event)" class="space-y-4 max-w-lg bg-white p-6 rounded shadow">
                    <div><label>NIS</label><input type="text" id="nis" required class="w-full border p-2 rounded"></div>
                    <div><label>Nama Siswa</label><input type="text" id="namaSiswa" required class="w-full border p-2 rounded"></div>
                    <div><label>Rombel</label><input type="text" id="rombelSiswa" required class="w-full border p-2 rounded"></div>
                    <div><label>Foto (URL/Base64)</label><input type="text" id="fotoSiswa" class="w-full border p-2 rounded"></div>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Simpan</button>
                </form>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        async function simpanSiswa(e) {
            e.preventDefault();
            let payload = [{
                nis: document.getElementById('nis').value,
                nama: document.getElementById('namaSiswa').value,
                rombel: document.getElementById('rombelSiswa').value,
                foto: document.getElementById('fotoSiswa').value
            }];
            await fetchStein('siswa', 'post', payload);
            loadDataSiswa();
        }

        async function importExcelSiswa(input) {
            let file = input.files[0];
            let reader = new FileReader();
            reader.onload = async function(e) {
                let data = new Uint8Array(e.target.result);
                let workbook = XLSX.read(data, {type: 'array'});
                let sheet = workbook.Sheets[workbook.SheetNames[0]];
                let json = XLSX.utils.sheet_to_json(sheet);
                await fetchStein('siswa', 'post', json);
                alert('Import berhasil!');
                loadDataSiswa();
            };
            reader.readAsArrayBuffer(file);
        }

        // --- GURU MODULES ---
        function loadGuruDashboard() {
            document.getElementById('mainContent').innerHTML = `<h2 class="text-2xl font-bold mb-4">Dashboard Guru: ${currentUser.nama}</h2><p>Gunakan menu di samping untuk mengelola Mapel, Absen QR, dan Rekap.</p>`;
        }

        async function loadGuruMapel() {
            let mapel = await fetchStein('mapel');
            let myMapel = mapel.filter(m => m.guru === currentUser.nama);
            let html = `<h2 class="text-2xl font-bold mb-4">Data Mapel yang Diajarkan</h2><ul class="bg-white rounded shadow p-4 space-y-2">`;
            myMapel.forEach(m => {
                html += `<li class="border-b pb-2"><strong>${m.nama_mapel}</strong> - Kelas: ${m.rombel}</li>`;
            });
            html += `</ul>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        async function loadGuruAbsen() {
            let html = `<h2 class="text-2xl font-bold mb-4">Absensi & QR Scan</h2>
                <button onclick="openQrScanner()" class="bg-green-600 text-white px-4 py-3 rounded-lg font-bold"><i class="fa-solid fa-camera mr-2"></i>Buka Kamera Scan QR</button>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        function openQrScanner() {
            document.getElementById('qrModal').classList.remove('hidden');
            const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            scanner.render(onScanSuccess, onScanFailure);
        }

        function closeQrModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        async function onScanSuccess(decodedText) {
            alert(`Berhasil Scan: NIS ${decodedText}`);
            // Kirim data absensi otomatis ke database
            let payload = [{
                nis: decodedText,
                tanggal: new Date().toISOString().split('T')[0],
                jam_pelajaran: "1",
                mapel: "Matematika",
                status: "Hadir"
            }];
            await fetchStein('absensi', 'post', payload);
            closeQrModal();
        }

        function onScanFailure(error) {
            // Error handling scan jika diperlukan
        }

        async function loadGuruBelumAbsen() {
            let siswa = await fetchStein('siswa');
            let absensi = await fetchStein('absensi');
            let hariIni = new Date().toISOString().split('T')[0];
            let absenHariIni = absensi.filter(a => a.tanggal === hariIni);
            let belum = siswa.filter(s => !absenHariIni.some(a => a.nis === s.nis));

            let html = `<h2 class="text-2xl font-bold mb-4">Daftar Siswa Belum Absen</h2>
                <div class="bg-white rounded shadow overflow-x-auto"><table class="w-full text-left border-collapse">
                <thead><tr class="bg-gray-200 border-b"><th class="p-3">NIS</th><th class="p-3">Nama</th><th class="p-3">Rombel</th><th class="p-3">Aksi Manual</th></tr></thead><tbody>`;
            belum.forEach(s => {
                html += `<tr class="border-b">
                    <td class="p-3">${s.nis}</td><td class="p-3">${s.nama}</td><td class="p-3">${s.rombel}</td>
                    <td class="p-3 space-x-1">
                        <button onclick="absenManual('${s.nis}', 'Hadir')" class="bg-green-500 text-white px-2 py-1 rounded text-xs">Hadir</button>
                        <button onclick="absenManual('${s.nis}', 'Izin')" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs">Izin</button>
                        <button onclick="absenManual('${s.nis}', 'Sakit')" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">Sakit</button>
                        <button onclick="absenManual('${s.nis}', 'Alfa')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Alfa</button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        async function absenManual(nis, status) {
            let payload = [{
                nis: nis,
                tanggal: new Date().toISOString().split('T')[0],
                jam_pelajaran: "1",
                mapel: "Manual",
                status: status
            }];
            await fetchStein('absensi', 'post', payload);
            loadGuruBelumAbsen();
        }

        async function loadGuruRekap() {
            let absensi = await fetchStein('absensi');
            let html = `<h2 class="text-2xl font-bold mb-4">Rekap Absensi</h2>
                <button onclick="exportExcel()" class="bg-green-600 text-white px-4 py-2 rounded mb-4"><i class="fa-solid fa-file-excel mr-2"></i>Download Excel</button>
                <div class="bg-white rounded shadow overflow-x-auto"><table class="w-full text-left border-collapse" id="rekapTable">
                <thead><tr class="bg-gray-200 border-b"><th class="p-3">NIS</th><th class="p-3">Tanggal</th><th class="p-3">Jam Ke</th><th class="p-3">Mapel</th><th class="p-3">Status</th></tr></thead><tbody>`;
            absensi.forEach(a => {
                html += `<tr class="border-b"><td class="p-3">${a.nis}</td><td class="p-3">${a.tanggal}</td><td class="p-3">${a.jam_pelajaran}</td><td class="p-3">${a.mapel}</td><td class="p-3">${a.status}</td></tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('mainContent').innerHTML = html;
        }

        function exportExcel() {
            let table = document.getElementById("rekapTable");
            let wb = XLSX.utils.table_to_book(table, {sheet: "Rekap Absen"});
            XLSX.writeFile(wb, "Rekap_Absensi.xlsx");
        }

        // Placeholder fungsi admin tambahan agar tidak error saat dipanggil
        function loadDataKelas() { loadAdminDashboard(); }
        function loadDataGuru() { loadAdminDashboard(); }
        function loadWaliKelas() { loadAdminDashboard(); }
        function loadPeriode() { loadAdminDashboard(); }
        function loadManajemenUser() { loadAdminDashboard(); }
        function loadProfilSekolah() { loadAdminDashboard(); }
        function loadGuruSiswa() { loadGuruMapel(); }
    </script>
</body>
</html>
